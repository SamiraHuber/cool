    function renderMapSvg(points, { mode = 'points', emptyLabel = 'No data.' } = {}) {
      if (!points.length) {
        return `<div class="text-muted">${emptyLabel}</div>`;
      }

      const width = 720;
      const height = 420;
      const padding = 36;
      const xs = points.map(p => Number(p.x)).filter(Number.isFinite);
      const ys = points.map(p => Number(p.y)).filter(Number.isFinite);
      if (!xs.length || !ys.length) {
        return `<div class="text-muted">${emptyLabel}</div>`;
      }

      const minX = -2.5;
      const maxX = 2.5;
      const minY = -2.5;
      const maxY = 2.5;

      const scaleX = x => padding + ((x - minX) / (maxX - minX)) * (width - padding * 2);
      const scaleY = y => height - padding - ((y - minY) / (maxY - minY)) * (height - padding * 2);

      const axes = `
        <line x1="${padding}" y1="${height - padding}" x2="${width - padding}" y2="${height - padding}" stroke="#b8c2cc" stroke-width="1.5"/>
        <line x1="${padding}" y1="${padding}" x2="${padding}" y2="${height - padding}" stroke="#b8c2cc" stroke-width="1.5"/>
        <text x="${width - padding}" y="${height - 10}" font-size="12" fill="#5f6b76" text-anchor="end">x</text>
        <text x="12" y="${padding}" font-size="12" fill="#5f6b76">y</text>
        <text x="${padding}" y="${height - 10}" font-size="11" fill="#5f6b76">${minX.toFixed(2)}</text>
        <text x="${width - padding}" y="${height - 10}" font-size="11" fill="#5f6b76" text-anchor="end">${maxX.toFixed(2)}</text>
        <text x="12" y="${height - padding}" font-size="11" fill="#5f6b76">${minY.toFixed(2)}</text>
        <text x="12" y="${padding + 12}" font-size="11" fill="#5f6b76">${maxY.toFixed(2)}</text>
      `;

      const palette = [
        '#1d4ed8', '#dc2626', '#059669', '#d97706', '#7c3aed',
        '#0891b2', '#65a30d', '#db2777', '#4f46e5', '#ea580c',
        '#0f766e', '#9333ea', '#b91c1c', '#2563eb', '#15803d',
      ];

      function colorForObjectId(objectId) {
        const text = String(objectId || '');
        let hash = 0;
        for (let i = 0; i < text.length; i += 1) {
          hash = ((hash * 31) + text.charCodeAt(i)) >>> 0;
        }
        return palette[hash % palette.length];
      }

      let layers = '';
      if (mode === 'heatmap') {
        const bins = new Map();
        const binsPerAxis = 12;
        for (const point of points) {
          const px = Number(point.x);
          const py = Number(point.y);
          if (px < minX || px > maxX || py < minY || py > maxY) {
            continue;
          }
          const bx = Math.max(0, Math.min(binsPerAxis - 1, Math.floor(((px - minX) / (maxX - minX)) * binsPerAxis)));
          const by = Math.max(0, Math.min(binsPerAxis - 1, Math.floor(((py - minY) / (maxY - minY)) * binsPerAxis)));
          const key = `${bx}:${by}`;
          bins.set(key, (bins.get(key) || 0) + 1);
        }
        if (bins.size > 0) {
          const maxCount = Math.max(...bins.values());
          layers += Array.from(bins.entries()).map(([key, count]) => {
          const [bx, by] = key.split(':').map(Number);
          const cx = padding + ((bx + 0.5) / binsPerAxis) * (width - padding * 2);
          const cy = height - padding - ((by + 0.5) / binsPerAxis) * (height - padding * 2);
          const intensity = count / maxCount;
          const radius = 6 + intensity * 18;
          const opacity = 0.16 + intensity * 0.35;
          return `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="rgba(242, 101, 34, ${opacity.toFixed(3)})" />`;
        }).join('');
      }
      }

      layers += points.filter(point => {
        const px = Number(point.x);
        const py = Number(point.y);
        return px >= minX && px <= maxX && py >= minY && py <= maxY;
      }).map(point => {
        const cx = scaleX(Number(point.x));
        const cy = scaleY(Number(point.y));
        const title = `${point.class_name || 'object'} | ${point.object_id} | (${Number(point.x).toFixed(2)}, ${Number(point.y).toFixed(2)}, ${Number(point.z ?? 0).toFixed(2)})`;
        const fill = mode === 'points' ? colorForObjectId(point.object_id) : '#1d4ed8';
        return `
          <circle cx="${cx}" cy="${cy}" r="4" fill="${fill}" fill-opacity="0.75" stroke="#ffffff" stroke-width="1.2">
            <title>${title}</title>
          </circle>
        `;
      }).join('');

      return `<svg class="map-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">${axes}${layers}</svg>`;
    }

    function renderGridToCanvasDataUrl(gridWidth, gridHeight, values, occupiedColor = 'blue') {
      if (gridWidth <= 0 || gridHeight <= 0) {
        return '';
      }
      const canvas = document.createElement('canvas');
      canvas.width = gridWidth;
      canvas.height = gridHeight;
      const ctx = canvas.getContext('2d', { willReadFrequently: false });
      const imageData = ctx.createImageData(gridWidth, gridHeight);
      const data = imageData.data;
      const occupiedColors = {
        blue: [29, 78, 216],
        orange: [234, 88, 12],
        red: [185, 28, 28],
      };
      const [occR, occG, occB] = occupiedColors[occupiedColor] || occupiedColors.blue;

      for (let row = 0; row < gridHeight; row += 1) {
        const flippedRow = gridHeight - 1 - row;
        const rowOffset = flippedRow * gridWidth;
        for (let col = 0; col < gridWidth; col += 1) {
          const value = Number(values[row * gridWidth + col] ?? -1);
          const idx = (rowOffset + col) * 4;
          if (value === 0) {
            data[idx] = 227;
            data[idx + 1] = 232;
            data[idx + 2] = 239;
            data[idx + 3] = 255;
          } else if (value > 0) {
            const opacity = Math.min(0.95, 0.20 + (value / 100) * 0.75);
            data[idx] = occR;
            data[idx + 1] = occG;
            data[idx + 2] = occB;
            data[idx + 3] = Math.round(opacity * 255);
          } else {
            data[idx] = 247;
            data[idx + 1] = 248;
            data[idx + 2] = 250;
            data[idx + 3] = 255;
          }
        }
      }

      ctx.putImageData(imageData, 0, 0);
      return canvas.toDataURL('image/png');
    }

    function buildOccupancyGridBaseCacheKey(payload, viewportKey, width, padding, drawableHeight) {
      const map = payload?.map || {};
      const stats = payload?.stats || {};
      return JSON.stringify([
        viewportKey,
        payload?.source || '',
        payload?.generated_at || '',
        map.frame_id || '',
        Number(map.origin?.x ?? 0),
        Number(map.origin?.y ?? 0),
        Number(map.resolution ?? 0),
        Number(map.width ?? 0),
        Number(map.height ?? 0),
        Array.isArray(map.data) ? map.data.length : 0,
        Number(stats.occupied_cells ?? -1),
        Number(stats.observed_cells ?? -1),
        Number(stats.unknown_cells ?? -1),
        width,
        padding,
        drawableHeight,
      ]);
    }

    function getCachedOccupancyGridBase(payload, viewportKey, width, padding, drawableWidth, drawableHeight, extents = {}, occupiedColor = 'blue') {
      const map = payload.map;
      const resolution = Number(map.resolution ?? 0.1);
      const gridWidth = Number(map.width ?? 0);
      const gridHeight = Number(map.height ?? 0);
      const height = drawableHeight + padding * 2;
      const defaultMinX = Number(map.origin?.x ?? -10);
      const defaultMinY = Number(map.origin?.y ?? -10);
      const defaultMaxX = defaultMinX + gridWidth * resolution;
      const defaultMaxY = defaultMinY + gridHeight * resolution;
      const minX = Number.isFinite(Number(extents.minX)) ? Number(extents.minX) : defaultMinX;
      const minY = Number.isFinite(Number(extents.minY)) ? Number(extents.minY) : defaultMinY;
      const maxX = Number.isFinite(Number(extents.maxX)) ? Number(extents.maxX) : defaultMaxX;
      const maxY = Number.isFinite(Number(extents.maxY)) ? Number(extents.maxY) : defaultMaxY;
      const cellWidth = drawableWidth / Math.max(gridWidth, 1);
      const cellHeight = drawableHeight / Math.max(gridHeight, 1);
      const values = Array.isArray(map.data) ? map.data : [];
      const cacheKey = JSON.stringify([
        buildOccupancyGridBaseCacheKey(payload, viewportKey, width, padding, drawableHeight),
        minX,
        minY,
        maxX,
        maxY,
        occupiedColor,
      ]);
      const cached = occupancyGridBaseCache.get(cacheKey);
      if (cached) {
        return cached;
      }

      const axes = `
        <line x1="${padding}" y1="${height - padding}" x2="${width - padding}" y2="${height - padding}" stroke="#b8c2cc" stroke-width="1.5"/>
        <line x1="${padding}" y1="${padding}" x2="${padding}" y2="${height - padding}" stroke="#b8c2cc" stroke-width="1.5"/>
        <text x="${width - padding}" y="${height - 10}" font-size="12" fill="#5f6b76" text-anchor="end">x</text>
        <text x="12" y="${padding}" font-size="12" fill="#5f6b76">y</text>
        <text x="${padding}" y="${height - 10}" font-size="11" fill="#5f6b76">${minX.toFixed(1)}</text>
        <text x="${width - padding}" y="${height - 10}" font-size="11" fill="#5f6b76" text-anchor="end">${maxX.toFixed(1)}</text>
        <text x="12" y="${height - padding}" font-size="11" fill="#5f6b76">${minY.toFixed(1)}</text>
        <text x="12" y="${padding + 12}" font-size="11" fill="#5f6b76">${maxY.toFixed(1)}</text>
      `;

      const gridImageUrl = renderGridToCanvasDataUrl(gridWidth, gridHeight, values, occupiedColor);

      const base = {
        axes,
        gridImageUrl,
        height,
        minX,
        minY,
        maxX,
        maxY,
        resolution,
        gridWidth,
        gridHeight,
      };
      occupancyGridBaseCache.set(cacheKey, base);
      if (occupancyGridBaseCache.size > 6) {
        const oldestKey = occupancyGridBaseCache.keys().next().value;
        occupancyGridBaseCache.delete(oldestKey);
      }
      return base;
    }

    function renderOccupancyGridSvg(payload, viewportKey = 'map', options = {}) {
      if (!payload || !payload.available || !payload.map) {
        return `<div class="text-muted">No ${(options.mapName || 'occupancy map')} available yet.</div>`;
      }

      const map = payload.map;
      const stats = payload.stats || {};
      const width = 720;
      const padding = 36;
      const resolution = Number(map.resolution ?? 0.1);
      const gridWidth = Number(map.width ?? 0);
      const gridHeight = Number(map.height ?? 0);
      const drawableWidth = width - padding * 2;
      const drawableHeight = Math.max(240, Math.round(drawableWidth * (Math.max(gridHeight, 1) / Math.max(gridWidth, 1))));
      const includeLiveScan = options.includeLiveScan !== false;
      const includeLiveDetections = options.includeLiveDetections !== false;
      const includePersistedDetections = options.includePersistedDetections !== false;
      const includePlannedPath = options.includePlannedPath !== false;
      const includeRooms = options.includeRooms !== false;
      const robot = (() => {
        const primaryRobot = payload.robot;
        if (primaryRobot && Number.isFinite(Number(primaryRobot.x)) && Number.isFinite(Number(primaryRobot.y))) {
          return primaryRobot;
        }
        const fallbackRobot = lidarOccupancyMap?.robot;
        if (fallbackRobot && Number.isFinite(Number(fallbackRobot.x)) && Number.isFinite(Number(fallbackRobot.y))) {
          return fallbackRobot;
        }
        return null;
      })();
      const requireDynosamPosition = viewportKey === 'map';
      const detections = (includeLiveDetections ? (Array.isArray(payload.detections) ? payload.detections : []) : [])
        .filter(det => !requireDynosamPosition || Boolean(det.has_dynosam_position) || Boolean(det.has_depth_position) || det.position_source === 'depth');
      const persistedDetections = includePersistedDetections
        ? (Array.isArray(lidarDetectionMarkers) ? lidarDetectionMarkers : [])
        : [];
      const roomItems = includeRooms
        ? (roomMarkingMode ? roomDrafts : activeMapRooms())
        : [];
      const plannedPath = includePlannedPath && Array.isArray(plannedNavigation?.plan?.path) ? plannedNavigation.plan.path : [];
      const plannedStart = includePlannedPath ? (plannedNavigation?.plan?.start?.planned_world || null) : null;
      const plannedGoal = includePlannedPath ? (plannedNavigation?.plan?.goal?.planned_world || null) : null;

      const mapMinX = Number(map.origin?.x ?? -10);
      const mapMinY = Number(map.origin?.y ?? -10);
      const mapMaxX = mapMinX + gridWidth * resolution;
      const mapMaxY = mapMinY + gridHeight * resolution;
      const extentPoints = [];
      if (robot && Number.isFinite(Number(robot.x)) && Number.isFinite(Number(robot.y))) {
        extentPoints.push({ x: Number(robot.x), y: Number(robot.y) });
      }
      for (const point of plannedPath) {
        if (Number.isFinite(Number(point?.x)) && Number.isFinite(Number(point?.y))) {
          extentPoints.push({ x: Number(point.x), y: Number(point.y) });
        }
      }
      for (const point of [plannedStart, plannedGoal]) {
        if (point && Number.isFinite(Number(point.x)) && Number.isFinite(Number(point.y))) {
          extentPoints.push({ x: Number(point.x), y: Number(point.y) });
        }
      }
      const extentMargin = Math.max(0.5, resolution * 6);
      const minX = Math.min(mapMinX, ...extentPoints.map(point => point.x - extentMargin));
      const minY = Math.min(mapMinY, ...extentPoints.map(point => point.y - extentMargin));
      const maxX = Math.max(mapMaxX, ...extentPoints.map(point => point.x + extentMargin));
      const maxY = Math.max(mapMaxY, ...extentPoints.map(point => point.y + extentMargin));
      const occupiedColor = options.occupiedColor || 'blue';
      const base = getCachedOccupancyGridBase(
        payload,
        viewportKey,
        width,
        padding,
        drawableWidth,
        drawableHeight,
        { minX, minY, maxX, maxY },
        occupiedColor,
      );
      const height = base.height;
      mapCoordParams[viewportKey] = { minX, minY, maxX, maxY, width, height, padding, drawableWidth, drawableHeight };

      const scaleX = x => padding + ((x - minX) / Math.max(maxX - minX, 1e-6)) * drawableWidth;
      const scaleY = y => height - padding - ((y - minY) / Math.max(maxY - minY, 1e-6)) * drawableHeight;
      let robotOverlay = '';
      let robotScreenPosition = null;
      if (robot && Number.isFinite(Number(robot.x)) && Number.isFinite(Number(robot.y))) {
        const rx = scaleX(Number(robot.x));
        const ry = scaleY(Number(robot.y));
        robotScreenPosition = { x: rx, y: ry };
        const robotYaw = Number.isFinite(Number(robot.yaw)) ? Number(robot.yaw) : 0;
        const arrowLen = 14;
        const tipX = rx + Math.cos(robotYaw) * arrowLen;
        const tipY = ry - Math.sin(robotYaw) * arrowLen;
        const arrowSvg = Number.isFinite(Number(robot.yaw))
          ? `<line x1="${rx}" y1="${ry}" x2="${tipX}" y2="${tipY}" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" />`
          : '';
        const battery = payload.battery;
        let batterySvg = '';
        if (battery && Number.isFinite(Number(battery.charge_percentage))) {
          const pct = Number(battery.charge_percentage);
          const batteryColor = pct >= 50 ? '#22c55e' : (pct >= 20 ? '#f97316' : '#ef4444');
          batterySvg = `
            <rect x="${rx - 18}" y="${ry - 28}" width="36" height="14" rx="3" fill="rgba(0,0,0,0.7)" />
            <text x="${rx}" y="${ry - 17}" text-anchor="middle" fill="${batteryColor}" font-size="10" font-family="sans-serif" font-weight="bold">${pct.toFixed(0)}%</text>
          `;
        }
        robotOverlay = `
          ${batterySvg}
          <circle cx="${rx}" cy="${ry}" r="8" fill="#f59e0b" stroke="#ffffff" stroke-width="2">
            <title>robot (${Number(robot.x).toFixed(2)}, ${Number(robot.y).toFixed(2)}, ${Number(robot.z ?? 0).toFixed(2)}) yaw ${robotYaw.toFixed(2)}</title>
          </circle>
          <circle cx="${rx}" cy="${ry}" r="16" fill="none" stroke="rgba(245, 158, 11, 0.35)" stroke-width="2" />
          ${arrowSvg}
        `;
      }

      const scanFrameId = lidarScanSnapshot?.frame_id || lidarScanSnapshot?.sensor_frame_id || '';
      const mapFrameId = map.frame_id || '';
      const scanAligned = !scanFrameId || !mapFrameId || scanFrameId === mapFrameId;
      let scanOverlay = '';
      if (includeLiveScan && scanAligned && lidarScanSnapshot && lidarScanSnapshot.available && Array.isArray(lidarScanSnapshot.points)) {
        scanOverlay = lidarScanSnapshot.points
          .filter(point => Array.isArray(point) && point.length >= 2)
          .filter(point => Number.isFinite(Number(point[0])) && Number.isFinite(Number(point[1])))
          .filter(point => Number(point[0]) >= minX && Number(point[0]) <= maxX && Number(point[1]) >= minY && Number(point[1]) <= maxY)
          .map(point => {
            const px = scaleX(Number(point[0]));
            const py = scaleY(Number(point[1]));
            return `<circle cx="${px}" cy="${py}" r="1.4" fill="rgba(245, 158, 11, 0.75)" />`;
          })
          .join('');
      }

      const detectionOverlay = detections
        .filter(det => Number.isFinite(Number(det.x)) && Number.isFinite(Number(det.y)))
        .filter(det => Number(det.x) >= minX && Number(det.x) <= maxX && Number(det.y) >= minY && Number(det.y) <= maxY)
        .map(det => {
          const px = scaleX(Number(det.x));
          const py = scaleY(Number(det.y));
          const overlapsRobot = robotScreenPosition
            && Math.abs(px - robotScreenPosition.x) < 4
            && Math.abs(py - robotScreenPosition.y) < 4;
          const markerY = overlapsRobot ? py - 20 : py;
          const classLabel = det.class_name || (Number.isFinite(Number(det.class_id)) && Number(det.class_id) >= 0 ? `class ${det.class_id}` : 'detected object');
          const trackLabel = Number.isFinite(Number(det.track_id)) && Number(det.track_id) >= 0 ? `track ${Number(det.track_id)}` : 'untracked';
          const scoreLabel = Number.isFinite(Number(det.score)) ? Number(det.score).toFixed(2) : '-';
          return `
            ${overlapsRobot ? `<line x1="${px}" y1="${py - 8}" x2="${px}" y2="${markerY + 7}" stroke="rgba(220, 38, 38, 0.7)" stroke-width="2" />` : ''}
            <circle cx="${px}" cy="${markerY}" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2">
              <title>${classLabel} | instance ${Number(det.instance_id)} | ${trackLabel} | score ${scoreLabel} | (${Number(det.x).toFixed(2)}, ${Number(det.y).toFixed(2)}, ${Number(det.z ?? 0).toFixed(2)})</title>
            </circle>
            <circle cx="${px}" cy="${markerY}" r="13" fill="none" stroke="rgba(220, 38, 38, 0.35)" stroke-width="2" />
          `;
        })
        .join('');

      const persistedDetectionOverlay = persistedDetections
        .filter(det => Number.isFinite(Number(det.x)) && Number.isFinite(Number(det.y)))
        .filter(det => Number(det.x) >= minX && Number(det.x) <= maxX && Number(det.y) >= minY && Number(det.y) <= maxY)
        .map(det => {
          const px = scaleX(Number(det.x));
          const py = scaleY(Number(det.y));
          const classLabel = det.class_name || (Number.isFinite(Number(det.class_id)) && Number(det.class_id) >= 0 ? `class ${det.class_id}` : 'stored detection');
          const trackLabel = det.yolo_track_id ? `track ${det.yolo_track_id}` : 'untracked';
          const createdAtLabel = det.scene_timestamp || det.created_at || '-';
          const thumbWidth = 34;
          const thumbHeight = 26;
          const thumbX = px + 8;
          const thumbY = py - thumbHeight - 10;
          const safeImageUrl = det.image_url || '';
          const safeImageTitle = escapeHtml(`${classLabel} | observation ${Number(det.observation_id)}`);
          return `
            <rect x="${px - 5}" y="${py - 5}" width="10" height="10" fill="#7f1d1d" stroke="#ffffff" stroke-width="1.5" rx="2" ry="2" />
            ${showPersistedDetectionImages ? `
              <line x1="${px + 4}" y1="${py - 4}" x2="${thumbX}" y2="${thumbY + thumbHeight - 3}" stroke="rgba(127, 29, 29, 0.75)" stroke-width="1.5" />
              <rect x="${thumbX - 2}" y="${thumbY - 2}" width="${thumbWidth + 4}" height="${thumbHeight + 4}" fill="rgba(255,255,255,0.96)" stroke="#7f1d1d" stroke-width="1.5" rx="4" ry="4">
                <title>${classLabel} | ${trackLabel} | observation ${Number(det.observation_id)} | (${Number(det.x).toFixed(2)}, ${Number(det.y).toFixed(2)}, ${Number(det.z ?? 0).toFixed(2)}) | ${createdAtLabel}</title>
              </rect>
              ${safeImageUrl
                ? `<image href="${safeImageUrl}" x="${thumbX}" y="${thumbY}" width="${thumbWidth}" height="${thumbHeight}" preserveAspectRatio="xMidYMid slice" style="cursor:zoom-in" onclick="openPersistedDetectionModal('${escapeHtml(safeImageUrl)}', '${safeImageTitle}', ${Number(det.observation_id)})" />`
                : `<rect x="${thumbX}" y="${thumbY}" width="${thumbWidth}" height="${thumbHeight}" fill="#f3d5d5" rx="3" ry="3" />`
              }
            ` : ''}
          `;
        })
        .join('');

      const plannedPathOverlay = plannedPath.length >= 2
        ? `
          <polyline
            points="${plannedPath
              .filter(point => Number.isFinite(Number(point.x)) && Number.isFinite(Number(point.y)))
              .map(point => `${scaleX(Number(point.x))},${scaleY(Number(point.y))}`)
              .join(' ')}"
            fill="none"
            stroke="#16a34a"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
            opacity="0.95"
          />
        `
        : '';

      const plannedEndpointsOverlay = `
        ${plannedStart && Number.isFinite(Number(plannedStart.x)) && Number.isFinite(Number(plannedStart.y))
          ? `<circle cx="${scaleX(Number(plannedStart.x))}" cy="${scaleY(Number(plannedStart.y))}" r="6" fill="#22c55e" stroke="#ffffff" stroke-width="2"><title>planned start</title></circle>`
          : ''}
        ${plannedGoal && Number.isFinite(Number(plannedGoal.x)) && Number.isFinite(Number(plannedGoal.y))
          ? `<circle cx="${scaleX(Number(plannedGoal.x))}" cy="${scaleY(Number(plannedGoal.y))}" r="6" fill="#15803d" stroke="#ffffff" stroke-width="2"><title>planned goal</title></circle>`
          : ''}
      `;

      const roomOverlay = roomItems
        .filter(room => Number.isFinite(Number(room.x1)) && Number.isFinite(Number(room.y1)) && Number.isFinite(Number(room.x2)) && Number.isFinite(Number(room.y2)))
        .map((room, index) => {
          const hasQuad = Number.isFinite(Number(room.x3)) && Number.isFinite(Number(room.y3)) && Number.isFinite(Number(room.x4)) && Number.isFinite(Number(room.y4));
          const label = escapeHtml(room.name || `room ${index + 1}`);
          if (hasQuad) {
            const x1 = scaleX(Number(room.x1));
            const y1 = scaleY(Number(room.y1));
            const x2 = scaleX(Number(room.x2));
            const y2 = scaleY(Number(room.y2));
            const x3 = scaleX(Number(room.x3));
            const y3 = scaleY(Number(room.y3));
            const x4 = scaleX(Number(room.x4));
            const y4 = scaleY(Number(room.y4));
            return `
              <polygon points="${x1},${y1} ${x2},${y2} ${x3},${y3} ${x4},${y4}" fill="rgba(22, 163, 74, 0.10)" stroke="rgba(22, 163, 74, 0.95)" stroke-width="2">
                <title>${label}</title>
              </polygon>
              <text x="${x1 + 6}" y="${y1 + 16}" font-size="12" fill="#166534" font-weight="700">${label}</text>
            `;
          }
          // Fallback rectangle for legacy 2-corner rooms
          const x1 = scaleX(Number(room.x1));
          const y1 = scaleY(Number(room.y1));
          const x2 = scaleX(Number(room.x2));
          const y2 = scaleY(Number(room.y2));
          const left = Math.min(x1, x2);
          const top = Math.min(y1, y2);
          const rectWidth = Math.max(4, Math.abs(x2 - x1));
          const rectHeight = Math.max(4, Math.abs(y2 - y1));
          return `
            <rect x="${left}" y="${top}" width="${rectWidth}" height="${rectHeight}" fill="rgba(22, 163, 74, 0.10)" stroke="rgba(22, 163, 74, 0.95)" stroke-width="2" rx="4" ry="4">
              <title>${label}</title>
            </rect>
            <text x="${left + 6}" y="${top + 16}" font-size="12" fill="#166534" font-weight="700">${label}</text>
          `;
        })
        .join('');

      const scanShown = includeLiveScan && scanAligned && lidarScanSnapshot && lidarScanSnapshot.available;
      const summary = `
        <div class="muted mt-2">
          frame: ${map.frame_id || '-'} |
          scan frame: ${includeLiveScan && lidarScanSnapshot && lidarScanSnapshot.available ? (lidarScanSnapshot.frame_id || '-') : '-'} |
          scan aligned: ${scanShown ? 'yes' : (includeLiveScan && lidarScanSnapshot && lidarScanSnapshot.available ? 'no (frames differ)' : 'n/a')} |
          resolution: ${resolution.toFixed(2)} m |
          occupied cells: ${stats.occupied_cells ?? 0} |
          scans processed: ${stats.scans_processed ?? 0} |
          live detections: ${stats.active_detections ?? detections.length} |
          saved detections: ${persistedDetections.length} |
          rooms: ${roomItems.length} |
          planned path: ${plannedPath.length ? `${plannedPath.length} waypoints` : 'none'} |
          live scan points: ${scanShown ? (lidarScanSnapshot.num_points ?? 0) : 0} |
          robot: ${robot && Number.isFinite(Number(robot.x)) && Number.isFinite(Number(robot.y))
            ? `(${Number(robot.x).toFixed(2)}, ${Number(robot.y).toFixed(2)})`
            : 'unknown'}
        </div>
      `;

      const isCustomPathClickMode = customPathMode && viewportKey === 'map';
      const isClickToPlanMode = clickToPlanMode && viewportKey === 'map';
      const isRoomClickMode = roomMarkingMode && viewportKey === 'map';
      const isClickMode = isCustomPathClickMode || isClickToPlanMode || isRoomClickMode;
      const customPointsOverlay = (viewportKey === 'map' && customPathPoints.length > 0)
        ? customPathPoints.map((p, i) => {
            const px = scaleX(p.x);
            const py = scaleY(p.y);
            const label = i === 0 ? 'Start' : 'End';
            const color = i === 0 ? '#3b82f6' : '#8b5cf6';
            return `<circle cx="${px}" cy="${py}" r="8" fill="${color}" stroke="#fff" stroke-width="2.5"><title>${label} (${p.x.toFixed(2)}, ${p.y.toFixed(2)})</title></circle>`;
          }).join('')
        : '';
      const roomDraftColors = ['#059669', '#16a34a', '#84cc16', '#ca8a04'];
      const roomDraftPointsOverlay = (viewportKey === 'map' && roomDraftPoints.length > 0)
        ? roomDraftPoints.map((p, i) => {
            const px = scaleX(p.x);
            const py = scaleY(p.y);
            return `<circle cx="${px}" cy="${py}" r="7" fill="${roomDraftColors[i] || '#16a34a'}" stroke="#fff" stroke-width="2"><title>room corner ${i + 1}</title></circle>`;
          }).join('')
        : '';

      const zoomedWidth = Math.round(width * occupancyMapZoom);
      const zoomedHeight = Math.round(height * occupancyMapZoom);
      return `
        <div>
          ${renderOccupancyMapZoomControls()}
          <div
            class="zoom-viewport"
            id="zoom-viewport-${viewportKey}"
            onscroll="rememberOccupancyMapScroll('${viewportKey}')"
            onwheel="handleOccupancyMapWheel(event)"
            title="Use Ctrl + mouse wheel or the buttons to zoom"
          >
            <div class="zoom-stage">
              <svg class="map-svg zoomable" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet" shape-rendering="crispEdges" style="width:${zoomedWidth}px;height:${zoomedHeight}px;${isClickMode ? 'cursor:crosshair;' : ''}" ${isClickMode ? `onclick="handleMapSvgClick(event, '${viewportKey}')"` : ''}>${base.axes}${base.gridImageUrl ? `<image href="${base.gridImageUrl}" x="${padding}" y="${padding}" width="${drawableWidth}" height="${drawableHeight}" preserveAspectRatio="none" />` : ''}${scanOverlay}${plannedPathOverlay}${plannedEndpointsOverlay}${persistedDetectionOverlay}${roomOverlay}${robotOverlay}${detectionOverlay}${customPointsOverlay}${roomDraftPointsOverlay}</svg>
            </div>
          </div>
          ${summary}
        </div>
      `;
    }

    function focusScene(sceneId) {
      selectedSceneId = sceneId;
      const scene = scenes.find(s => s.id === sceneId);
      const sceneInteractions = interactions.filter(i => i.scene_id === sceneId);
      if (!scene) {
        updateEarlierSceneButton();
        return;
      }
      document.getElementById('details-panel').style.display = '';
      document.getElementById('detailTitle').textContent = `Scene ${scene.id}`;
      document.getElementById('details').innerHTML = `
        <div class="mb-3">
          <div><strong>Caption:</strong> ${scene.caption || '(no caption)'}</div>
          <div class="muted">timestamp: ${scene.timestamp ? new Date(scene.timestamp).toLocaleString() : '-'}</div>
          <div class="muted">position: (${scene.x ?? '-'}, ${scene.y ?? '-'})</div>
        </div>
        <div class="mb-4">
          ${scene.original_image_url || scene.stitched_image_url
            ? `<div style="display:flex;gap:8px;flex-wrap:wrap;">
                ${scene.original_image_url ? `<div style="flex:1;min-width:140px;"><div class="muted" style="font-size:10px;">original</div><img src="${scene.original_image_url}" alt="Scene ${scene.id} original" class="scene-preview clickable-image" loading="lazy" decoding="async" onclick="openImageModal('${escapeHtml(scene.original_image_url)}', 'Scene ${scene.id} (original)')" /></div>` : ''}
                ${scene.stitched_image_url ? `<div style="flex:1;min-width:140px;"><div class="muted" style="font-size:10px;">stitched</div><img src="${scene.stitched_image_url}" alt="Scene ${scene.id} stitched" class="scene-preview clickable-image" loading="lazy" decoding="async" onclick="openImageModal('${escapeHtml(scene.stitched_image_url)}', 'Scene ${scene.id} (stitched)')" /></div>` : ''}
               </div>`
            : '<div class="text-muted">No annotated scene image stored for this scene.</div>'}
        </div>
        <div>
          <h5>Interactions</h5>
          ${sceneInteractions.length ? sceneInteractions.map(renderSceneInteractionCard).join('') : '<div class="text-muted">No interactions stored for this scene.</div>'}
        </div>
      `;
      updateEarlierSceneButton();
    }

    function getSortedScenes() {
      const filterEl = document.getElementById('filter-with-description');
      const filterActive = filterEl && filterEl.checked;
      return [...scenes]
        .filter(s => !filterActive || (s.caption && s.caption.trim()))
        .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    }

    function focusEarlierScene() {
      const sorted = getSortedScenes();
      const currentIndex = sorted.findIndex(s => s.id === selectedSceneId);
      if (currentIndex >= 0 && currentIndex + 1 < sorted.length) {
        const earlierScene = sorted[currentIndex + 1];
        focusScene(earlierScene.id);
        const row = document.querySelector(`tr[onclick="focusScene(${earlierScene.id})"]`);
        if (row) {
          row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }
    }

    function updateEarlierSceneButton() {
      const btn = document.getElementById('earlier-scene-btn');
      if (!btn) return;
      if (currentTab !== 'scenes' || selectedSceneId === null) {
        btn.disabled = true;
        return;
      }
      const sorted = getSortedScenes();
      const currentIndex = sorted.findIndex(s => s.id === selectedSceneId);
      btn.disabled = !(currentIndex >= 0 && currentIndex + 1 < sorted.length);
    }

    function showInteraction(interactionId) {
      const interaction = interactions.find(i => i.id === interactionId);
      if (!interaction) {
        return;
      }
      document.getElementById('details-panel').style.display = '';
      document.getElementById('detailTitle').textContent = `Interaction ${interaction.id}`;
      document.getElementById('details').innerHTML = renderInteractionDetail(interaction);
    }

    function renderInteractionCard(interaction) {
      return `
        <div class="item" onclick="showInteraction(${interaction.id})">
          <div><strong>${interaction.caption || interaction.action || 'interaction'}</strong></div>
          <div class="muted">action: ${interaction.action || '-'}</div>
          <div class="muted">linked objects: ${interaction.objects.length}</div>
        </div>
      `;
    }

    function renderSceneInteractionCard(interaction) {
      return `
        <div class="item">
          <div class="d-flex justify-content-between align-items-start gap-3">
            <div>
              <div><strong>${interaction.caption || interaction.action || 'interaction'}</strong></div>
              <div class="muted">action: ${interaction.action || '-'}</div>
              <div class="muted">linked objects: ${interaction.objects.length}</div>
            </div>
            <button class="btn btn-sm btn-outline-primary" onclick="showInteraction(${interaction.id})">Open</button>
          </div>
          <div class="thumb-grid mt-3">
            ${interaction.objects.map(obj => `
              <div class="thumb-card">
                <img src="${obj.image_url}" class="img-fluid clickable-image" loading="lazy" decoding="async" onclick="openImageModal('${escapeHtml(obj.image_url)}', '${escapeHtml(obj.class_name ? `${obj.class_name}` : 'object')}')" />
                <div><strong>${obj.class_name ? `${obj.class_name}` : 'object'}</strong></div>
                <div class="muted">cluster: ${obj.object_id}</div>
                <div class="muted">track: ${obj.yolo_track_id ?? '-'}</div>
                <div class="muted">obs #${obj.observation_id}</div>
              </div>
            `).join('') || '<div class="text-muted">No linked observations.</div>'}
          </div>
        </div>
      `;
    }

    function renderInteractionDetail(interaction) {
      return `
        <div class="mb-3">
          <div><strong>${interaction.caption || interaction.action || 'interaction'}</strong></div>
          <div class="muted">action: ${interaction.action || '-'}</div>
          <div class="muted">scene: ${interaction.scene_id ?? '-'}</div>
          <div class="muted">model source: ${interaction.model_source || '-'}</div>
          <div class="muted">timestamp: ${(interaction.scene_timestamp || interaction.created_at) ? new Date(interaction.scene_timestamp || interaction.created_at).toLocaleString() : '-'}</div>
        </div>
        ${interaction.scene_id ? `
          <div class="mb-4">
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <div style="flex:1;min-width:140px;"><div class="muted" style="font-size:10px;">original</div><img src="/api/scenes/${interaction.scene_id}/original_image" alt="Scene ${interaction.scene_id} original" class="scene-preview" onerror="this.style.display='none';this.parentElement.style.display='none';" /></div>
              <div style="flex:1;min-width:140px;"><div class="muted" style="font-size:10px;">stitched</div><img src="/api/scenes/${interaction.scene_id}/stitched_image" alt="Scene ${interaction.scene_id} stitched" class="scene-preview" onerror="this.style.display='none';this.parentElement.style.display='none';" /></div>
            </div>
          </div>
        ` : ''}
        <div class="thumb-grid">
          ${interaction.objects.map(obj => `
            <div class="thumb-card">
              <img src="${obj.image_url}" class="img-fluid clickable-image" loading="lazy" decoding="async" onclick="openImageModal('${escapeHtml(obj.image_url)}', '${escapeHtml(obj.class_name ? `${obj.class_name}` : 'object')}')" />
              <div><strong>${obj.class_name ? `${obj.class_name}` : 'object'}</strong></div>
              <div class="muted">cluster: ${obj.object_id}</div>
              <div class="muted">track: ${obj.yolo_track_id ?? '-'}</div>
              <div class="muted">obs #${obj.observation_id}</div>
            </div>
          `).join('') || '<div class="text-muted">No linked observations.</div>'}
        </div>
        ${(interaction.subject_bbox || interaction.object_bbox) ? `
          <div class="mt-3">
            <div class="muted">subject bbox: ${interaction.subject_bbox ? JSON.stringify(interaction.subject_bbox) : '-'}</div>
            <div class="muted">object bbox: ${interaction.object_bbox ? JSON.stringify(interaction.object_bbox) : '-'}</div>
          </div>
        ` : ''}
      `;
    }

    function initialTab() {
      const params = new URLSearchParams(window.location.search);
      const tab = params.get('tab') || '{{ active_page|default("scenes") }}';
      const knownTabs = new Set(['scenes', 'objects', 'persons', 'interactions', 'map', 'robot_view']);
      return knownTabs.has(tab) ? tab : 'scenes';
    }
    function yawFromQuaternion(q) {
      if (!q) return 0.0;
      return Math.atan2(2 * (q.w * q.z + q.x * q.y), 1 - 2 * (q.y * q.y + q.z * q.z));
    }

    function adjustRobotViewRange(delta) {
      robotViewRange = Math.max(2, Math.min(50, robotViewRange + delta));
      renderRobotViewPanel();
    }

    function renderRobotViewPanel() {
      const container = document.getElementById('robot-view-content');
      if (!container) return;

      const robot = slamRobotPose && slamRobotPose.position && Number.isFinite(Number(slamRobotPose.position.x))
        ? {
            x: Number(slamRobotPose.position.x),
            y: Number(slamRobotPose.position.y),
            z: Number(slamRobotPose.position.z),
            yaw: yawFromQuaternion(slamRobotPose.orientation),
          }
        : (lidarOccupancyMap && lidarOccupancyMap.available ? lidarOccupancyMap.robot : null);
      const liveDetections = lidarOccupancyMap && lidarOccupancyMap.available && Array.isArray(lidarOccupancyMap.detections)
        ? lidarOccupancyMap.detections
        : [];

      // Most recent observation per DynoSAM object that has a valid location and is fresh (< 30 s old).
      // observationTopoObservations is sorted DESC, so the first hit per object is the most recent.
      const nowMs = Date.now();
      const dynosamByObject = new Map();
      for (const obs of observationTopoObservations) {
        if (!Number.isFinite(Number(obs.x)) || !Number.isFinite(Number(obs.y))) continue;
        if (obs.created_at && (nowMs - new Date(obs.created_at).getTime()) > 30000) continue;
        if (!dynosamByObject.has(obs.object_id)) {
          dynosamByObject.set(obs.object_id, obs);
        }
      }
      const dynosamObservations = Array.from(dynosamByObject.values());

      if (!robot || !Number.isFinite(Number(robot.x)) || !Number.isFinite(Number(robot.y))) {
        container.innerHTML = `
          <div class="stat-grid">
            <div class="stat-card">
              <div class="muted">Robot position</div>
              <div><strong>Unknown</strong></div>
            </div>
            <div class="stat-card">
              <div class="muted">DynoSAM objects</div>
              <div><strong>${dynosamObservations.length}</strong></div>
            </div>
          </div>
          <div class="map-card">
            <div class="text-muted">No robot position available yet. Waiting for lidar map data...</div>
          </div>
        `;
        return;
      }

      const robotX = Number(robot.x);
      const robotY = Number(robot.y);
      const robotZ = Number(robot.z ?? 0);
      const robotYaw = Number.isFinite(Number(robot.yaw)) ? Number(robot.yaw) : 0;
      const range = robotViewRange;

      const svgSize = 600;
      const padding = 50;
      const drawSize = svgSize - padding * 2;

      // obs.x/y are world coordinates in spot/odom.
      // Convert world delta into the robot body frame:
      //   body.x = forward
      //   body.y = left
      const worldToRobot = (worldX, worldY) => {
        const dx = Number(worldX) - robotX;
        const dy = Number(worldY) - robotY;
        const fwd = Math.cos(robotYaw) * dx + Math.sin(robotYaw) * dy;
        const left = -Math.sin(robotYaw) * dx + Math.cos(robotYaw) * dy;
        return { fwd, left, right: -left };
      };

      const toSvgX = right => padding + ((range + right) / (2 * range)) * drawSize;
      const toSvgY = fwd => padding + ((range - fwd) / (2 * range)) * drawSize;

      const cx0 = toSvgX(0);
      const cy0 = toSvgY(0);

      // Range rings
      let rings = '';
      for (const r of [2, 4, 6, 8, 10, 15, 20, 30, 50].filter(r => r < range)) {
        const svgR = (r / (2 * range)) * drawSize;
        rings += `<circle cx="${cx0}" cy="${cy0}" r="${svgR}" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4" />`;
        rings += `<text x="${(cx0 + svgR + 3).toFixed(1)}" y="${(cy0 + 4).toFixed(1)}" font-size="9" fill="#94a3b8">${r}m</text>`;
      }
      // Outer ring at exact range
      const outerR = (range / (2 * range)) * drawSize;
      rings += `<circle cx="${cx0}" cy="${cy0}" r="${outerR}" fill="none" stroke="#cbd5e1" stroke-width="1.5" />`;

      // Axes are robot-centric after rotating world coordinates by robot yaw.
      const axes = `
        <line x1="${padding}" y1="${cy0.toFixed(1)}" x2="${svgSize - padding}" y2="${cy0.toFixed(1)}" stroke="#cbd5e1" stroke-width="1" />
        <line x1="${cx0.toFixed(1)}" y1="${padding}" x2="${cx0.toFixed(1)}" y2="${svgSize - padding}" stroke="#cbd5e1" stroke-width="1" />
        <text x="${svgSize - padding - 2}" y="${(cy0 - 5).toFixed(1)}" font-size="10" fill="#64748b" text-anchor="end">Right</text>
        <text x="${(padding + 2).toFixed(1)}" y="${(cy0 - 5).toFixed(1)}" font-size="10" fill="#64748b">Left</text>
        <text x="${(cx0 + 4).toFixed(1)}" y="${(padding + 12).toFixed(1)}" font-size="10" fill="#64748b">Fwd</text>
        <text x="${(cx0 + 4).toFixed(1)}" y="${(svgSize - padding - 4).toFixed(1)}" font-size="10" fill="#64748b">Back</text>
        <text x="${(svgSize - padding - 2).toFixed(1)}" y="${(cy0 + 14).toFixed(1)}" font-size="9" fill="#94a3b8" text-anchor="end">+${range.toFixed(0)}m</text>
        <text x="${(padding + 2).toFixed(1)}" y="${(cy0 + 14).toFixed(1)}" font-size="9" fill="#94a3b8">+${range.toFixed(0)}m</text>
        <text x="${(cx0 + 4).toFixed(1)}" y="${(padding + 22).toFixed(1)}" font-size="9" fill="#94a3b8">+${range.toFixed(0)}m</text>
        <text x="${(cx0 + 4).toFixed(1)}" y="${(svgSize - padding - 14).toFixed(1)}" font-size="9" fill="#94a3b8">+${range.toFixed(0)}m</text>
      `;

      // Robot box at center (pointing up = forward in robot frame)
      const robotSvg = `
        <rect x="${(cx0 - 13).toFixed(1)}" y="${(cy0 - 10).toFixed(1)}" width="26" height="20" rx="4" fill="#f59e0b" stroke="#b45309" stroke-width="2" />
        <polygon points="${cx0.toFixed(1)},${(cy0 - 18).toFixed(1)} ${(cx0 - 9).toFixed(1)},${(cy0 - 8).toFixed(1)} ${(cx0 + 9).toFixed(1)},${(cy0 - 8).toFixed(1)}" fill="#b45309" />
        <text x="${cx0.toFixed(1)}" y="${(cy0 + 24).toFixed(1)}" font-size="11" fill="#92400e" text-anchor="middle" font-weight="bold">ROBOT</text>
        <text x="${cx0.toFixed(1)}" y="${(cy0 + 36).toFixed(1)}" font-size="9" fill="#78350f" text-anchor="middle">(${robotX.toFixed(2)}, ${robotY.toFixed(2)}, ${robotZ.toFixed(2)}) yaw ${robotYaw.toFixed(2)}</text>
      `;

      // DynoSAM tracked objects (blue) — with SVG thumbnails
      let dynosamSvg = '';
      let dynoInView = 0;
      const thumbW = 44;
      const thumbH = 34;
      for (const obs of dynosamObservations) {
        if (!Number.isFinite(Number(obs.x)) || !Number.isFinite(Number(obs.y))) continue;
        const { fwd, left: lat, right } = worldToRobot(obs.x, obs.y);
        if (Math.abs(fwd) > range || Math.abs(lat) > range) continue;
        dynoInView++;
        const px = toSvgX(right);
        const py = toSvgY(fwd);
        const label = obs.class_name || obs.object_id;
        const dist = Math.hypot(fwd, lat).toFixed(1);
        const imageUrl = `/api/observations/${obs.id}/image`;
        const safeLabel = escapeHtml(String(label));
        const dfwd = fwd.toFixed(1);
        const dright = right.toFixed(1);
        const safeTitle = escapeHtml(`${label} | obs ${obs.id} | fwd ${dfwd}m right ${dright}m | dist ${dist}m`);
        // Place thumbnail above-right, flipping left if too close to the right edge
        const thumbX = px + 10 > svgSize - padding - thumbW - 4 ? px - thumbW - 14 : px + 10;
        const thumbY = Math.max(padding + 2, py - thumbH - 16);
        dynosamSvg += `
          <line x1="${px.toFixed(1)}" y1="${(py - 7).toFixed(1)}" x2="${(thumbX + thumbW / 2).toFixed(1)}" y2="${(thumbY + thumbH + 2).toFixed(1)}" stroke="rgba(37,99,235,0.5)" stroke-width="1.5" />
          <rect x="${(thumbX - 2).toFixed(1)}" y="${(thumbY - 2).toFixed(1)}" width="${thumbW + 4}" height="${thumbH + 4}" fill="rgba(255,255,255,0.96)" stroke="#2563eb" stroke-width="1.5" rx="3" ry="3">
            <title>${safeTitle}</title>
          </rect>
          <image href="${imageUrl}" x="${thumbX.toFixed(1)}" y="${thumbY.toFixed(1)}" width="${thumbW}" height="${thumbH}" preserveAspectRatio="xMidYMid slice" style="cursor:zoom-in" onclick="openImageModal('${imageUrl}', '${safeTitle}')" />
          <circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="7" fill="#2563eb" fill-opacity="0.85" stroke="#ffffff" stroke-width="1.5">
            <title>${safeLabel} | object ${obs.object_id} | fwd ${dfwd}m right ${dright}m | dist ${dist}m</title>
          </circle>
          <text x="${px.toFixed(1)}" y="${(py + 20).toFixed(1)}" font-size="9" fill="#1e40af" text-anchor="middle" font-weight="bold">${safeLabel}</text>
          <text x="${px.toFixed(1)}" y="${(py + 30).toFixed(1)}" font-size="9" fill="#1d4ed8" text-anchor="middle">F${dfwd} R${dright} ${dist}m</text>
        `;
      }

      // Object list table — DynoSAM objects and live YOLO detections
      const allInView = [];
      for (const obs of dynosamObservations) {
        if (!Number.isFinite(Number(obs.x)) || !Number.isFinite(Number(obs.y))) continue;
        const { fwd, left: lat, right } = worldToRobot(obs.x, obs.y);
        if (Math.abs(fwd) > range || Math.abs(lat) > range) continue;
        const imageUrl = `/api/observations/${obs.id}/image`;
        allInView.push({
          type: 'DynoSAM',
          label: obs.class_name || obs.object_id,
          fwd,
          right,
          dist: Math.hypot(fwd, lat),
          extra: `object ${obs.object_id}`,
          imageUrl,
          imageTitle: escapeHtml(`${obs.class_name || obs.object_id} | obs ${obs.id}`),
        });
      }
      for (const det of liveDetections) {
        if (!Number.isFinite(Number(det.x)) || !Number.isFinite(Number(det.y))) continue;
        const { fwd, left: lat, right } = worldToRobot(det.x, det.y);
        if (Math.abs(fwd) > range || Math.abs(lat) > range) continue;
        const label = det.class_name || (det.class_id >= 0 ? `class ${det.class_id}` : 'detection');
        const score = Number.isFinite(det.score) ? ` (${(det.score * 100).toFixed(0)}%)` : '';
        allInView.push({
          type: 'YOLO',
          label,
          fwd,
          right,
          dist: Math.hypot(fwd, lat),
          extra: `track ${det.track_id ?? '-'}${score}`,
          imageUrl: null,
          imageTitle: '',
        });
      }
      allInView.sort((a, b) => a.dist - b.dist);

      const tableRows = allInView.map(o => `
        <tr>
          <td><span class="badge" style="background:${o.type === 'YOLO' ? '#dc2626' : '#2563eb'}">${o.type}</span></td>
          <td>
            ${o.imageUrl
              ? `<img src="${o.imageUrl}" alt="${o.imageTitle}" title="${o.imageTitle}" loading="lazy" decoding="async"
                   style="width:56px;height:42px;object-fit:cover;border-radius:4px;border:1px solid #cbd5e1;cursor:zoom-in;vertical-align:middle;margin-right:6px;"
                   onclick="openImageModal('${o.imageUrl}', '${o.imageTitle}')" />`
              : '<span style="display:inline-block;width:56px;height:42px;background:#f1f5f9;border-radius:4px;border:1px solid #e2e8f0;vertical-align:middle;margin-right:6px;"></span>'}
            ${escapeHtml(String(o.label))}
          </td>
          <td>${o.fwd.toFixed(2)}</td>
          <td>${o.right.toFixed(2)}</td>
          <td>${o.dist.toFixed(2)}</td>
          <td class="muted">${o.extra}</td>
        </tr>
      `).join('');

      container.innerHTML = `
        <div class="stat-grid">
          <div class="stat-card">
            <div class="muted">Robot position (world)</div>
            <div><strong>(${robotX.toFixed(3)}, ${robotY.toFixed(3)}, ${robotZ.toFixed(3)})</strong></div>
          </div>
          <div class="stat-card">
            <div class="muted">DynoSAM objects</div>
            <div><strong>${dynoInView}</strong> in view / ${dynosamObservations.length} total</div>
          </div>
          <div class="stat-card">
            <div class="muted">YOLO detections</div>
            <div><strong>${liveDetections.length}</strong> live</div>
          </div>
          <div class="stat-card">
            <div class="muted">View range</div>
            <div><strong>±${range}m</strong></div>
          </div>
        </div>
        <div class="map-card">
          <h5>Video Recording</h5>
          <div class="map-toolbar" style="margin-bottom:8px;">
            <button id="btnStartVideo" class="btn btn-sm btn-danger" onclick="startVideoRecording()">⏺ Start</button>
            <button id="btnStopVideo" class="btn btn-sm btn-outline-secondary" onclick="stopVideoRecording()">⏹ Stop</button>
            <span id="videoRecordStatus" class="zoom-label" style="min-width:180px;">Not recording</span>
          </div>
        </div>
        <div class="map-card">
          <h5>Robot-Centric View</h5>
          <div class="map-toolbar">
            <button class="btn btn-sm btn-outline-secondary" onclick="adjustRobotViewRange(-2)">− Zoom in</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="adjustRobotViewRange(2)">+ Zoom out</button>
            <span class="zoom-label">±${range}m</span>
          </div>
          <div style="overflow:auto;">
            <svg viewBox="0 0 ${svgSize} ${svgSize}" width="${svgSize}" height="${svgSize}" style="display:block;max-width:100%;border:1px solid #e2e8f0;border-radius:12px;background:linear-gradient(180deg,#fbfbfb,#f1f4f6);">
              ${rings}${axes}${dynosamSvg}${robotSvg}
            </svg>
          </div>
          <div class="map-legend">
            <div><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#2563eb;margin-right:4px;vertical-align:middle;"></span>DynoSAM tracked objects — thumbnail = most recent observation image (click to enlarge)</div>
            <div><span style="display:inline-block;width:14px;height:12px;background:#f59e0b;margin-right:4px;vertical-align:middle;border-radius:2px;"></span>Robot (arrow = +Y world direction)</div>
            <div>Frame: world positions in spot/odom, rotated into the robot body frame using current robot yaw. Coordinates: F=forward, R=right. Updates every 3 s.</div>
          </div>
        </div>
        ${allInView.length > 0 ? `
        <div class="map-card">
          <h5>Detected Objects in View — sorted by distance</h5>
          <table class="table table-sm table-hover align-middle">
            <thead>
              <tr><th>Source</th><th>Image &amp; Label</th><th>Forward (m)</th><th>Right (m)</th><th>Dist (m)</th><th>Info</th></tr>
            </thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>` : ''}
      `;
    }

    function renderCustomPathToolbar() {
      if (clickToPlanMode) {
        const errorHtml = clickToPlanError
          ? `<span class="text-danger" style="font-size:12px;">${escapeHtml(clickToPlanError)}</span>`
          : '';
        return `
          <div class="map-toolbar" style="gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px;">
            <button class="btn btn-sm btn-primary" onclick="toggleClickToPlanMode()">Cancel</button>
            <span class="muted">Click any point on the map to plan a path from the robot.</span>
            ${errorHtml}
          </div>
        `;
      }
      if (!customPathMode) {
        const errorHtml = customPathError
          ? `<span class="text-danger" style="font-size:12px;">${escapeHtml(customPathError)}</span>`
          : '';
        return errorHtml ? `<div class="map-toolbar" style="gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px;">${errorHtml}</div>` : '';
      }
      const statusMsg = customPathPoints.length === 0
        ? 'Click the <strong>start point</strong> on the map'
        : 'Click the <strong>end point</strong> on the map';
      return `
        <div class="map-toolbar" style="gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px;">
          <button class="btn btn-sm btn-primary" onclick="toggleCustomPathMode()">Cancel</button>
          <span class="muted">${statusMsg}</span>
        </div>
      `;
    }

    function renderRoomMarkingToolbar() {
      const activeMode = toolboxMapPersistence?.active_mode || 'idle';
      const canSelect = activeMode === 'frozen';
      const draftReady = roomDraftPoints.length === 4;
      const draftInProgress = roomDraftPoints.length > 0 && roomDraftPoints.length < 4;
      const placeholderName = `Room ${roomDrafts.length + 1}`;
      const nameInput = roomMarkingMode
        ? `<input id="room-draft-name" class="form-control form-control-sm" style="width:auto;min-width:160px;" placeholder="${escapeHtml(placeholderName)}" value="${escapeHtml(roomDraftName)}" oninput="updateRoomDraftName(this.value)" />`
        : '';
      const clearButton = (roomMarkingMode && (draftInProgress || draftReady))
        ? `<button class="btn btn-sm btn-outline-danger" onclick="clearRoomDraftPoints()">Clear points</button>`
        : '';
      const addButton = (roomMarkingMode && draftReady)
        ? `<button class="btn btn-sm btn-primary" onclick="addDraftRoom()">Add room</button>`
        : '';
      const saveButton = (roomMarkingMode && roomDrafts.length > 0)
        ? `<button class="btn btn-sm btn-outline-primary" onclick="saveMarkedRooms()">Save rooms</button>`
        : '';
      return `
        <div class="map-toolbar" style="gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px;">
          <button class="btn btn-sm btn-outline-primary" onclick="startRoomMarking()" ${canSelect ? '' : 'disabled'}>${roomMarkingMode ? 'Cancel room selection' : 'Select rooms'}</button>
          ${nameInput}
          ${addButton}
          ${clearButton}
          ${saveButton}
          ${roomMarkingMode && !draftReady
            ? `<span class="muted">Click ${4 - roomDraftPoints.length} more corner(s) on the map.</span>`
            : roomMarkingMode && draftReady
              ? `<span class="muted">Name the room if needed, then click Add room.</span>`
              : ''}
          ${roomDraftError ? `<span class="text-danger" style="font-size:12px;">${escapeHtml(roomDraftError)}</span>` : ''}
        </div>
      `;
    }

    function toggleCustomPathMode() {
      customPathMode = !customPathMode;
      customPathPoints = [];
      customPathError = null;
      if (customPathMode) {
        clickToPlanMode = false;
        clickToPlanError = null;
        roomMarkingMode = false;
        roomDraftPoints = [];
        roomDraftError = null;
      }
      renderMapPanel();
    }

    function toggleClickToPlanMode() {
      clickToPlanMode = !clickToPlanMode;
      clickToPlanError = null;
      if (clickToPlanMode) {
        customPathMode = false;
        customPathPoints = [];
        customPathError = null;
        roomMarkingMode = false;
        roomDraftPoints = [];
        roomDraftError = null;
      }
      renderMapPanel();
    }

    function handleMapSvgClick(event, viewportKey) {
      if (!customPathMode && !clickToPlanMode && !roomMarkingMode) return;
      const svgEl = event.currentTarget;
      const pt = svgEl.createSVGPoint();
      pt.x = event.clientX;
      pt.y = event.clientY;
      const svgPt = pt.matrixTransform(svgEl.getScreenCTM().inverse());
      const params = mapCoordParams[viewportKey];
      if (!params) return;
      const { minX, minY, maxX, maxY, width, height, padding, drawableWidth, drawableHeight } = params;
      const worldX = (svgPt.x - padding) / drawableWidth * (maxX - minX) + minX;
      const worldY = (height - padding - svgPt.y) / drawableHeight * (maxY - minY) + minY;
      if (roomMarkingMode && viewportKey === 'map') {
        if (roomDraftPoints.length >= 4) {
          return;
        }
        roomDraftPoints = [...roomDraftPoints, { x: worldX, y: worldY }];
        roomDraftError = null;
        if (currentTab === 'map') {
          renderMapPanel();
        }
        return;
      }
      if (clickToPlanMode && viewportKey === 'map') {
        planPathFromRobot(worldX, worldY);
        return;
      }
      if (viewportKey !== 'map') return;
      customPathPoints = [...customPathPoints, { x: worldX, y: worldY }];
      if (customPathPoints.length >= 2) {
        planCustomPath();
      } else {
        renderMapPanel();
      }
    }

    async function planCustomPath() {
      const [start, goal] = customPathPoints;
      customPathMode = false;
      customPathError = null;
      renderMapPanel();
      try {
        const response = await fetch('/api/map/plan_custom_path', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ start: { x: start.x, y: start.y }, goal: { x: goal.x, y: goal.y } }),
        });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || 'Path planning failed');
        }
        plannedNavigation = payload;
        customPathPoints = [];
      } catch (err) {
        customPathError = err.message || 'Path planning failed';
        customPathPoints = [];
      }
      renderMapPanel();
    }

    async function planPathFromRobot(goalX, goalY) {
      clickToPlanMode = false;
      clickToPlanError = null;
      renderMapPanel();
      try {
        const response = await fetch('/api/map/plan_custom_path', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ goal: { x: goalX, y: goalY } }),
        });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || 'Path planning failed');
        }
        plannedNavigation = payload;
      } catch (err) {
        clickToPlanError = err.message || 'Path planning failed';
      }
      renderMapPanel();
    }

    // Initialize
    ensureMapRefreshLoop();
    document.getElementById('scenes-panel').addEventListener('scroll', () => handleLazyPanelScroll('scenes'));
    document.getElementById('objects-panel').addEventListener('scroll', () => handleLazyPanelScroll('objects'));
    window.showTab = showTab;
    window.focusScene = focusScene;
    window.showObject = showObject;
    window.showPerson = showPerson;
    window.showInteraction = showInteraction;
    window.openImageModal = openImageModal;
    window.openPersistedDetectionModal = openPersistedDetectionModal;
    window.planNavigationToModalDetection = planNavigationToModalDetection;
    window.acceptPlannedNavigation = acceptPlannedNavigation;
    window.closeImageModal = closeImageModal;
    window.clearPlannedNavigation = clearPlannedNavigation;
    window.togglePersistedDetectionImages = togglePersistedDetectionImages;
    window.resetMapAndDetections = resetMapAndDetections;
    window.toggleCustomPathMode = toggleCustomPathMode;
    window.handleMapSvgClick = handleMapSvgClick;
    window.toggleClickToPlanMode = toggleClickToPlanMode;
    window.planPathFromRobot = planPathFromRobot;
    window.adjustRobotViewRange = adjustRobotViewRange;

    async function startVideoRecording() {
      try {
        const res = await fetch('/api/video/start', { method: 'POST' });
        if (!res.ok) throw new Error(await res.text());
        document.getElementById('videoRecordStatus').textContent = 'Starting…';
        setTimeout(updateVideoRecordStatus, 500);
      } catch (err) {
        alert('Failed to start recording: ' + err.message);
      }
    }
    async function stopVideoRecording() {
      try {
        const res = await fetch('/api/video/stop', { method: 'POST' });
        if (!res.ok) throw new Error(await res.text());
        document.getElementById('videoRecordStatus').textContent = 'Stopping…';
        setTimeout(updateVideoRecordStatus, 500);
      } catch (err) {
        alert('Failed to stop recording: ' + err.message);
      }
    }
    async function updateVideoRecordStatus() {
      try {
        const res = await fetch('/api/video/status');
        if (!res.ok) return;
        const data = await res.json();
        const label = document.getElementById('videoRecordStatus');
        if (!label) return;
        if (data.state === 'recording') {
          const frames = data.frames_recorded || 0;
          label.textContent = `● Recording ${frames} frames`;
          label.style.color = '#dc3545';
        } else if (data.state === 'stopped') {
          const file = data.filename || 'file';
          label.textContent = `✓ Saved: ${file}`;
          label.style.color = '#198754';
        } else {
          label.textContent = 'Not recording';
          label.style.color = '#555';
        }
      } catch (e) {}
    }
    setInterval(updateVideoRecordStatus, 2000);

    window.startVideoRecording = startVideoRecording;
    window.stopVideoRecording = stopVideoRecording;
    window.startRoomMarking = startRoomMarking;
    window.saveMarkedRooms = saveMarkedRooms;
    window.addDraftRoom = addDraftRoom;
    window.clearRoomDraftPoints = clearRoomDraftPoints;
    // Default to scenes tab
    showTab(initialTab());
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Scene and Object Browser</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    .main-content { display: flex; height: calc(100vh - 56px); }
    .panel { flex: 1; overflow: auto; padding: 16px; border-right: 1px solid #eee; }
    .panel:last-child { border-right: none; }
    .item { padding: 8px; border: 1px solid #ddd; margin-bottom: 8px; cursor: pointer; border-radius: 8px; }
    .item:hover { background: #f7f7f7; }
    .item.active { border-color: #0f766e; background: #edf8f5; }
    .list-toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .person-card { display: grid; grid-template-columns: 186px 1fr; gap: 10px; align-items: start; }
    .person-card-media-grid { display: grid; grid-template-columns: repeat(2, 88px); gap: 10px; }
    .person-card-media { width: 88px; height: 88px; border-radius: 10px; overflow: hidden; border: 1px solid #d7dee7; background: #f8fafc; }
    .person-card-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .person-card-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px; }
    .person-card-body { min-width: 0; }
    .thumb-card-media-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 8px; }
    .thumb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
    .thumb-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid #ccc; }
    .scene-preview { width: 100%; max-height: 420px; object-fit: contain; border-radius: 12px; border: 1px solid #ccc; background: #fafafa; }
    .muted { color: #666; font-size: 12px; }
    .nav-link.active { font-weight: bold; }
    .map-toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .map-card { border: 1px solid #ddd; border-radius: 12px; background: #fff; padding: 12px; margin-bottom: 16px; }
    .map-svg { width: 100%; height: 420px; border-radius: 12px; border: 1px solid #ccc; background: linear-gradient(180deg, #fbfbfb 0%, #f1f4f6 100%); }
    .map-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: #555; margin-top: 8px; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .stat-card { border: 1px solid #ddd; border-radius: 10px; padding: 10px; background: #fafafa; }
    .zoom-toolbar { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-bottom: 8px; flex-wrap: wrap; }
    .zoom-label { color: #555; font-size: 12px; min-width: 56px; text-align: right; }
    .zoom-viewport { overflow: auto; border-radius: 12px; border: 1px solid #ccc; background: linear-gradient(180deg, #fbfbfb 0%, #f1f4f6 100%); max-height: 520px; }
    .zoom-stage { min-width: 100%; min-height: 420px; display: flex; align-items: flex-start; justify-content: flex-start; }
    .map-svg.zoomable { width: auto; max-width: none; flex: 0 0 auto; border: none; border-radius: 0; }
    .clickable-image { cursor: zoom-in; }
    .image-modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.78); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 3000; }
    .image-modal.open { display: flex; }
    .image-modal-card { max-width: min(92vw, 1200px); max-height: 92vh; background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28); }
    .image-modal-title { color: #475569; font-size: 13px; margin-bottom: 10px; }
    .image-modal-img { display: block; max-width: 100%; max-height: calc(92vh - 70px); border-radius: 12px; background: #f8fafc; }
    .image-modal-actions { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 12px; }
    .image-modal-status { color: #475569; font-size: 12px; flex: 1; min-width: 220px; }
    .scene-nav-btn { position: fixed; top: 64px; right: 16px; z-index: 2000; }
  </style>
</head>
<body>

  {% include "_topnav.html" %}

  <button id="earlier-scene-btn" class="btn btn-primary scene-nav-btn" onclick="focusEarlierScene()" disabled>← Earlier scene</button>

  <div class="main-content">
    <div class="panel" id="scenes-panel">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h3 class="mb-0">Scenes</h3>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-danger" onclick="clearScenesForBuilding(); return false;">Clear all scenes</button>
          <button class="btn btn-sm btn-danger" onclick="deleteSelectedBuildingAndSwitch(); return false;">Delete building</button>
        </div>
      </div>
      <div class="mb-2">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="filter-with-description" onchange="renderScenesTable()">
          <label class="form-check-label" for="filter-with-description">Only show scenes with a description</label>
        </div>
      </div>
      <div id="scenes-table"></div>
    </div>
    <div class="panel" id="objects-panel" style="display:none;">
      <h3>Object Clusters</h3>
      <div class="mb-2 d-flex gap-3 flex-wrap align-items-end">
        <div>
          <label class="form-label" for="filter-min-observations">Minimum observations</label>
          <input type="number" class="form-control" id="filter-min-observations" value="0" min="0" style="max-width: 120px;" onchange="minObservations = Math.max(0, parseInt(this.value, 10) || 0); loadMoreObjects({ reset: true });">
        </div>
        <div>
          <label class="form-label" for="filter-object-class">Class</label>
          <select class="form-select" id="filter-object-class" style="min-width: 160px;" onchange="objectClassFilter = this.value; loadMoreObjects({ reset: true });">
            <option value="">All classes</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="filter-object-sort">Sort by</label>
          <select class="form-select" id="filter-object-sort" style="min-width: 170px;" onchange="objectSort = this.value; loadMoreObjects({ reset: true });">
            <option value="last_seen">Last seen (newest)</option>
            <option value="observations">Observations (most)</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="filter-object-id">Object ID</label>
          <input type="text" inputmode="numeric" class="form-control" id="filter-object-id" placeholder="e.g. 9812309399" style="max-width: 160px;"
                 oninput="objectIdSearch = this.value.trim().replace(/[^0-9]/g,''); queueObjectIdSearch();"
                 onkeydown="if (event.key === 'Enter') { event.preventDefault(); objectIdSearch = this.value.trim().replace(/[^0-9]/g,''); loadMoreObjects({ reset: true }); }">
        </div>
        <div>
          <label class="form-label" for="filter-object-name">Name</label>
          <input type="text" class="form-control" id="filter-object-name" placeholder="e.g. laptop_004" style="max-width: 180px;"
                 oninput="objectNameSearch = this.value.trim(); queueObjectNameSearch();"
                 onkeydown="if (event.key === 'Enter') { event.preventDefault(); objectNameSearch = this.value.trim(); loadMoreObjects({ reset: true }); }">
        </div>
        <div>
          <label class="form-label">Face rebuild</label>
          <div class="d-flex gap-2 align-items-center flex-wrap">
            <button type="button" class="btn btn-sm btn-primary" id="recluster-faces-btn" onclick="runFaceRecluster()">Recluster faces</button>
            <span class="d-flex align-items-center gap-1">
              <label class="form-label mb-0 meta" for="recluster-body-merge-sim" title="OSNet body-embedding cosine similarity threshold for merging provisional fragments into a main cluster. This is the MAIN dial: lower = visibly more merges, higher = visibly fewer. (The margin scales with this value.)">body sim</label>
              <input id="recluster-body-merge-sim" class="form-control form-control-sm" type="number" min="0" max="1" step="0.01" value="0.70" style="width: 76px;" title="OSNet body-embedding cosine similarity threshold. MAIN dial: lower = more merges, higher = fewer. Effective margin = margin × body sim.">
            </span>
            <span class="d-flex align-items-center gap-1">
              <label class="form-label mb-0 meta" for="recluster-body-merge-margin" title="Disambiguation strength. The required winner's margin = margin × body sim, so it scales with body sim. Higher = rejects ambiguous/mixed fragments more aggressively. Set 0 to merge purely on body sim.">margin</label>
              <input id="recluster-body-merge-margin" class="form-control form-control-sm" type="number" min="0" max="1" step="0.01" value="0.02" style="width: 70px;" title="Disambiguation strength. Effective required margin = margin × body sim. Higher = stricter; 0 = merge on body sim alone.">
            </span>
            <span class="d-flex align-items-center gap-1" title="Also re-run face detection on observations previously marked 'no face found' (NULL embedding). Most are genuinely back-of-head/occluded, so this recovers few faces and is slower.">
              <input class="form-check-input" type="checkbox" id="recluster-refind-faces">
              <label class="form-check-label meta" for="recluster-refind-faces">refind faces</label>
            </span>
          </div>
        </div>
        <div>
          <label class="form-label">Object recluster</label>
          <div class="d-flex gap-2 align-items-center flex-wrap">
            <button type="button" class="btn btn-sm btn-outline-primary" id="recluster-objects-btn" onclick="runObjectRecluster()">Recluster objects</button>
            <span class="d-flex align-items-center gap-1">
              <label class="form-label mb-0 meta" for="recluster-object-sim" title="Cosine similarity threshold for clustering NON-person object observations (ConvNeXt embeddings). Lower = merges more (fewer, larger clusters); higher = splits more. Persons are NOT affected (use Recluster faces for those).">obj sim</label>
              <input id="recluster-object-sim" class="form-control form-control-sm" type="number" min="0" max="1" step="0.01" value="0.50" style="width: 70px;" title="Cosine similarity threshold for non-person object clustering. Lower = merge more; higher = split more.">
            </span>
          </div>
        </div>
        <div id="recluster-objects-result" class="meta" style="align-self:center;"></div>
        <div id="recluster-faces-result" class="meta" style="align-self:center;"></div>
      </div>
      <div id="objects-list"></div>
    </div>
    <div class="panel" id="persons-panel" style="display:none;">
      <h3>Recognized Persons</h3>
      <div class="list-toolbar">
        <div class="form-check m-0">
          <input class="form-check-input" type="checkbox" id="filter-persons-with-face" onchange="togglePersonsWithFaceFilter()">
          <label class="form-check-label" for="filter-persons-with-face">Only show persons with at least one face</label>
        </div>
      </div>
      <div id="persons-list"></div>
    </div>
    <div class="panel" id="interactions-panel" style="display:none;">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
        <h3 class="mb-0">Interactions</h3>
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <div class="form-check mb-0">
            <input class="form-check-input" type="checkbox" id="interactions-both-linked" onchange="toggleInteractionsBothLinked()">
            <label class="form-check-label" for="interactions-both-linked">Two linked objects only</label>
          </div>
          <button type="button" class="btn btn-sm btn-outline-primary" id="reload-interactions-btn" onclick="reloadInteractions()">Reload interactions</button>
        </div>
      </div>
      <div id="reload-interactions-result" class="meta mb-2"></div>
      <div id="interactions-list"></div>
    </div>
    <div class="panel" id="map-panel" style="display:none;">
      <h3>Map</h3>
      <div id="map-content"></div>
    </div>
    <div class="panel" id="robot-view-panel" style="display:none;">
      <h3>Robot View</h3>
      <div id="robot-view-content"></div>
    </div>
    <div class="panel" id="details-panel" style="display:none;">
      <h3 id="detailTitle">Details</h3>
      <div id="details">Select an object cluster.</div>
    </div>
  </div>

  <div id="image-modal" class="image-modal" onclick="closeImageModal()">
    <div class="image-modal-card" onclick="event.stopPropagation()">
      <div id="image-modal-title" class="image-modal-title"></div>
      <img id="image-modal-img" class="image-modal-img" alt="Preview" />
      <div class="image-modal-actions">
        <div id="image-modal-status" class="image-modal-status"></div>
        <button id="image-modal-navigate-btn" class="btn btn-primary btn-sm" style="display:none;" onclick="planNavigationToModalDetection()">Navigate here</button>
      </div>
    </div>
  </div>

  <script>

    let rooms = [];
    let scenes = [];
    let objects = [];
    let persons = [];
    let selectedPersonId = null;
    let selectedSceneId = null;
    let filterPersonsWithFace = false;
    let interactions = [];
    let interactionsBothLinked = false;
    let observationTopoObservations = [];
    let lidarOccupancyMap = null;
    let toolboxMapSnapshot = null;
    let nav2GlobalCostmap = null;
    let toolboxMapPersistence = { available: false, maps: [], status: { state: 'idle' } };
    let slamRobotPose = null;
    let lidarDetectionMarkers = [];
    let lidarScanSnapshot = null;
    let currentTab = 'scenes';
    let mapRefreshTimer = null;
    let occupancyMapZoom = 1;
    let plannedNavigation = null;
    let navigationExecutionStatus = { available: false, state: 'idle' };
    let robotViewRange = 8;
    let imageModalContext = null;
    let showPersistedDetectionImages = false;
    let selectedToolboxSavedMapName = '';
    let newMapStartedAt = 0;
    let mapRefreshInFlight = false;
    let toolboxMapActionInProgress = false;
    let customPathMode = false;
    let customPathPoints = [];
    let customPathError = null;
    let clickToPlanMode = false;
    let clickToPlanError = null;
    let roomMarkingMode = false;
    let roomDraftPoints = [];
    let roomDrafts = [];
    let roomDraftName = '';
    let roomDraftError = null;
    const mapCoordParams = {};
    const occupancyGridBaseCache = new Map();
    const NEW_MAP_EMPTY_VIEW_MS = 10000;
    const SCENES_PAGE_SIZE = 50;
    const OBJECTS_PAGE_SIZE = 50;
    let scenePagination = { offset: 0, total: null, hasMore: true, loading: false, initialized: false, error: null };
    let objectPagination = { offset: 0, total: null, hasMore: true, loading: false, initialized: false, error: null };
    let occupancyMapScrollState = {
      map: { left: 0, top: 0 },
      map_costmap: { left: 0, top: 0 },
      map_lidar: { left: 0, top: 0 },
    };
    const tabLoaded = new Set();
    let minObservations = 0;
    let objectClassFilter = '';
    let objectSort = 'last_seen';
    let objectIdSearch = '';
    let objectIdSearchTimer = null;
    function queueObjectIdSearch() {
      if (objectIdSearchTimer) clearTimeout(objectIdSearchTimer);
      objectIdSearchTimer = setTimeout(() => loadMoreObjects({ reset: true }), 350);
    }
    let objectNameSearch = '';
    let objectNameSearchTimer = null;
    function queueObjectNameSearch() {
      if (objectNameSearchTimer) clearTimeout(objectNameSearchTimer);
      objectNameSearchTimer = setTimeout(() => loadMoreObjects({ reset: true }), 350);
    }

    async function loadTabData(tab) {
      if (tabLoaded.has(tab)) {
        return;
      }
      tabLoaded.add(tab);

      try {
        if (tab === 'scenes') {
          if (!scenePagination.initialized) {
            await loadMoreScenes({ reset: true });
          }
          if (!interactions.length) {
            const res = await fetch(appendBuildingFilter('/api/interactions'));
            interactions = await res.json();
          }
        } else if (tab === 'objects') {
          await loadObjectClassFilter();
          if (!objectPagination.initialized) {
            await loadMoreObjects({ reset: true });
          }
        } else if (tab === 'persons') {
          if (!persons.length) {
            const res = await fetch(appendBuildingFilter('/api/persons'));
            persons = await res.json();
            renderPersonsList();
          }
        } else if (tab === 'interactions') {
          if (!interactions.length) {
            const res = await fetch(appendBuildingFilter(`/api/interactions?both_linked=${interactionsBothLinked}`));
            interactions = await res.json();
          }
          renderInteractionsList();
        } else if (tab === 'map') {
          const [mapRes, costmapRes, persistenceRes, markersRes, navRes, roomsRes, scanRes, lidarRes] = await Promise.all([
            fetch('/api/toolbox_map'),
            fetch('/api/nav2_global_costmap'),
            fetch('/api/toolbox_map/persistence'),
            fetch(appendBuildingFilter('/api/lidar_detection_markers')),
            fetch('/api/navigation/status'),
            fetch(`/api/rooms?_=${Date.now()}`, { cache: 'no-store' }),
            fetch('/api/lidar_scan'),
            fetch('/api/lidar_occupancy_map'),
          ]);
          toolboxMapSnapshot = await mapRes.json();
          nav2GlobalCostmap = await costmapRes.json();
          toolboxMapPersistence = await persistenceRes.json();
          lidarDetectionMarkers = await markersRes.json();
          navigationExecutionStatus = await navRes.json();
          rooms = await roomsRes.json();
          lidarScanSnapshot = await scanRes.json();
          lidarOccupancyMap = await lidarRes.json();
          syncSelectedToolboxSavedMap();
          renderMapPanel();
        } else if (tab === 'robot_view') {
          const [mapRes, obsRes, poseRes] = await Promise.all([
            fetch('/api/lidar_occupancy_map'),
            fetch(appendBuildingFilter('/api/observation_topo/observations')),
            fetch('/api/slam/robot_pose').catch(() => null),
          ]);
          lidarOccupancyMap = await mapRes.json();
          observationTopoObservations = await obsRes.json();
          slamRobotPose = poseRes && poseRes.ok ? await poseRes.json() : null;
          renderRobotViewPanel();
        }
      } catch (error) {
        console.error(`Failed to load tab data for ${tab}`, error);
      }
    }

    function getObjectById(objectId) {
      return objects.find(o => o.id === objectId) || null;
    }

    function renderPagedCountLabel(items, pagination, noun) {
      if (pagination.total === null) {
        return `Loaded ${items.length} ${noun}.`;
      }
      return `Loaded ${items.length} of ${pagination.total} ${noun}.`;
    }

    async function loadMoreScenes({ reset = false } = {}) {
      if (scenePagination.loading) {
        return;
      }
      if (!reset && !scenePagination.hasMore) {
        return;
      }
      if (reset) {
        scenes = [];
        scenePagination = { offset: 0, total: null, hasMore: true, loading: false, initialized: false, error: null };
        renderScenesTable();
      }

      scenePagination.loading = true;
      scenePagination.error = null;
      renderScenesTable();
      try {
        const response = await fetch(appendBuildingFilter(`/api/scenes?limit=${SCENES_PAGE_SIZE}&offset=${scenePagination.offset}`));
        const payload = await response.json();
        const items = Array.isArray(payload.items) ? payload.items : [];
        scenes = reset ? items : scenes.concat(items);
        scenePagination.offset = scenes.length;
        scenePagination.total = Number.isFinite(Number(payload.total)) ? Number(payload.total) : scenes.length;
        scenePagination.hasMore = Boolean(payload.has_more);
        scenePagination.initialized = true;
      } catch (error) {
        console.error('Failed to load scenes', error);
        scenePagination.error = 'Failed to load scenes.';
      } finally {
        scenePagination.loading = false;
        renderScenesTable();
        window.requestAnimationFrame(() => handleLazyPanelScroll('scenes'));
      }
    }

    async function loadObjectClassFilter() {
      const select = document.getElementById('filter-object-class');
      if (!select) {
        return;
      }
      try {
        const response = await fetch(appendBuildingFilter('/api/object-classes'));
        const classes = await response.json();
        const current = objectClassFilter;
        select.innerHTML = '<option value="">All classes</option>' + (Array.isArray(classes) ? classes : []).map(c => {
          const value = String(c.class_id);
          const label = `${c.class_name} (${c.class_id}) — ${c.cluster_count}`;
          const selected = value === String(current) ? ' selected' : '';
          return `<option value="${escapeHtml(value)}"${selected}>${escapeHtml(label)}</option>`;
        }).join('');
      } catch (error) {
        console.error('Failed to load object classes', error);
      }
    }

    let _faceReclusterPollTimer = null;
    async function runFaceRecluster() {
      const resultDiv = document.getElementById('recluster-faces-result');
      const btn = document.getElementById('recluster-faces-btn');
      const building = (window.getSelectedBuilding && window.getSelectedBuilding()) || '';
      const scopeText = building ? `person clusters in map "${building}"` : 'ALL person clusters (no map selected)';
      if (!window.confirm(`Rebuild ${scopeText} from face embeddings? This merges and splits person clusters and re-populates face observations. Continue?`)) {
        return;
      }
      if (_faceReclusterPollTimer) {
        clearInterval(_faceReclusterPollTimer);
        _faceReclusterPollTimer = null;
      }
      if (btn) btn.disabled = true;
      resultDiv.textContent = 'Starting face recluster...';
      try {
        const simInput = document.getElementById('recluster-body-merge-sim');
        const marginInput = document.getElementById('recluster-body-merge-margin');
        const refindInput = document.getElementById('recluster-refind-faces');
        const params = new URLSearchParams();
        if (simInput && simInput.value !== '') params.set('body_merge_sim', simInput.value);
        if (marginInput && marginInput.value !== '') params.set('body_merge_margin', marginInput.value);
        if (refindInput && refindInput.checked) params.set('refind_faces', 'true');
        if (building) params.set('building', building);
        const qs = params.toString();
        const res = await fetch('/api/objects/recluster-faces' + (qs ? `?${qs}` : ''), { method: 'POST' });
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(errText || `Face recluster failed with ${res.status}`);
        }
        const startData = await res.json();
        const jobId = startData.job_id;
        resultDiv.innerHTML = `<span class="meta">Face reclustering… job <code>${escapeHtml(jobId)}</code> started.</span>`;
        _faceReclusterPollTimer = setInterval(async () => {
          try {
            const pollRes = await fetch(`/api/objects/recluster-faces/jobs/${jobId}`);
            if (!pollRes.ok) return;
            const job = await pollRes.json();
            if (job.status === 'running') {
              const done = job.steps_done || 0;
              const total = job.total_steps || 4;
              const phase = job.phase ? ` (${escapeHtml(job.phase)})` : '';
              resultDiv.innerHTML = `<span class="meta">Face reclustering… step ${done} / ${total}${phase}</span>`;
            } else if (job.status === 'done') {
              clearInterval(_faceReclusterPollTimer);
              _faceReclusterPollTimer = null;
              if (btn) btn.disabled = false;
              const r = job.result || {};
              const fg = r.face_generation;
              const fgText = fg && fg.ran ? ` Generated face embeddings for ${fg.pending || 0} new obs.` : '';
              resultDiv.innerHTML = `
                <div style="border-left:3px solid #0d6efd;background:#f0f5ff;padding:6px 10px;border-radius:8px;">
                  <div style="font-weight:700;color:#0d6efd;font-size:13px;">Face recluster complete</div>
                  <div class="meta">${r.identities || 0} identities, ${r.observations_moved || 0} obs moved, ${r.provisional_body_merged || 0} fragments body-merged, ${r.face_observations_rebuilt || 0} faces rebuilt.${escapeHtml(fgText)}</div>
                </div>
              `;
              loadMoreObjects({ reset: true });
            } else if (job.status === 'error') {
              clearInterval(_faceReclusterPollTimer);
              _faceReclusterPollTimer = null;
              if (btn) btn.disabled = false;
              resultDiv.innerHTML = `<span style="color:#b00020;">${escapeHtml(job.error || 'Unknown error')}</span>`;
            }
          } catch (e) {
            // ignore poll errors
          }
        }, 2000);
      } catch (err) {
        if (btn) btn.disabled = false;
        resultDiv.innerHTML = `<span style="color:#b00020;">${escapeHtml(err.message || String(err))}</span>`;
      }
    }

    let _objectReclusterPollTimer = null;
    async function runObjectRecluster() {
      const resultDiv = document.getElementById('recluster-objects-result');
      const btn = document.getElementById('recluster-objects-btn');
      if (!window.confirm('Recluster ALL non-person object clusters from scratch (merge + split)? Person clusters are NOT affected. Continue?')) {
        return;
      }
      if (_objectReclusterPollTimer) {
        clearInterval(_objectReclusterPollTimer);
        _objectReclusterPollTimer = null;
      }
      if (btn) btn.disabled = true;
      resultDiv.textContent = 'Starting object recluster...';
      try {
        const simInput = document.getElementById('recluster-object-sim');
        const params = new URLSearchParams();
        params.set('exclude_persons', 'true');
        if (simInput && simInput.value !== '') params.set('object_similarity_threshold', simInput.value);
        const res = await fetch('/api/objects/recluster?' + params.toString(), { method: 'POST' });
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(errText || `Object recluster failed with ${res.status}`);
        }
        const startData = await res.json();
        const jobId = startData.job_id;
        resultDiv.innerHTML = `<span class="meta">Reclustering objects… job <code>${escapeHtml(jobId)}</code> started.</span>`;
        _objectReclusterPollTimer = setInterval(async () => {
          try {
            const pollRes = await fetch(`/api/objects/recluster/jobs/${jobId}`);
            if (!pollRes.ok) return;
            const job = await pollRes.json();
            if (job.status === 'running' || job.status === 'queued') {
              const done = job.classes_done || 0;
              const total = job.total_classes || 0;
              resultDiv.innerHTML = `<span class="meta">Reclustering objects… class ${done} / ${total}</span>`;
            } else if (job.status === 'done') {
              clearInterval(_objectReclusterPollTimer);
              _objectReclusterPollTimer = null;
              if (btn) btn.disabled = false;
              const r = job.result || {};
              resultDiv.innerHTML = `
                <div style="border-left:3px solid #0d6efd;background:#f0f5ff;padding:6px 10px;border-radius:8px;">
                  <div style="font-weight:700;color:#0d6efd;font-size:13px;">Object recluster complete</div>
                  <div class="meta">${r.classes_processed || 0} classes, ${r.observations_reassigned || 0} obs reassigned, ${r.objects_created || 0} created, ${r.objects_deleted || 0} deleted.</div>
                </div>
              `;
              loadMoreObjects({ reset: true });
            } else if (job.status === 'error') {
              clearInterval(_objectReclusterPollTimer);
              _objectReclusterPollTimer = null;
              if (btn) btn.disabled = false;
              resultDiv.innerHTML = `<span style="color:#b00020;">${escapeHtml(job.error || 'Unknown error')}</span>`;
            }
          } catch (e) {
            // ignore poll errors
          }
        }, 2000);
      } catch (err) {
        if (btn) btn.disabled = false;
        resultDiv.innerHTML = `<span style="color:#b00020;">${escapeHtml(err.message || String(err))}</span>`;
      }
    }

    async function loadMoreObjects({ reset = false } = {}) {
      if (objectPagination.loading) {
        return;
      }
      if (!reset && !objectPagination.hasMore) {
        return;
      }
      if (reset) {
        objects = [];
        objectPagination = { offset: 0, total: null, hasMore: true, loading: false, initialized: false, error: null };
        renderObjectsList();
      }

      objectPagination.loading = true;
      objectPagination.error = null;
      renderObjectsList();
      try {
        const classParam = objectClassFilter !== '' ? `&class_id=${encodeURIComponent(objectClassFilter)}` : '';
        const idParam = objectIdSearch !== '' ? `&object_id=${encodeURIComponent(objectIdSearch)}` : '';
        const nameParam = objectNameSearch !== '' ? `&name=${encodeURIComponent(objectNameSearch)}` : '';
        const response = await fetch(appendBuildingFilter(`/api/objects?limit=${OBJECTS_PAGE_SIZE}&offset=${objectPagination.offset}&min_observations=${minObservations}&sort=${objectSort}${classParam}${idParam}${nameParam}`));
        const payload = await response.json();
        const items = Array.isArray(payload.items) ? payload.items : [];
        objects = reset ? items : objects.concat(items);
        objectPagination.offset = objects.length;
        objectPagination.total = Number.isFinite(Number(payload.total)) ? Number(payload.total) : objects.length;
        objectPagination.hasMore = Boolean(payload.has_more);
        objectPagination.initialized = true;
      } catch (error) {
        console.error('Failed to load objects', error);
        objectPagination.error = 'Failed to load objects.';
      } finally {
        objectPagination.loading = false;
        renderObjectsList();
        window.requestAnimationFrame(() => handleLazyPanelScroll('objects'));
      }
    }

    function handleLazyPanelScroll(type) {
      const panel = document.getElementById(type === 'scenes' ? 'scenes-panel' : 'objects-panel');
      if (!panel || panel.offsetParent === null || panel.clientHeight === 0) {
        return;
      }
      const remaining = panel.scrollHeight - panel.scrollTop - panel.clientHeight;
      if (remaining > 240) {
        return;
      }
      if (type === 'scenes') {
        loadMoreScenes();
      } else {
        loadMoreObjects();
      }
    }

    function isLiveMapTab(tab = currentTab) {
      return tab === 'map' || tab === 'robot_view';
    }

    async function refreshLidarOccupancyMap({ rerender = true } = {}) {
      if (mapRefreshInFlight) {
        return;
      }
      const activeTab = currentTab;
      if (!isLiveMapTab(activeTab) && !executionMatchesPlannedNavigation()) {
        return;
      }

      mapRefreshInFlight = true;
      try {
        const cacheBust = Date.now();
        const requests = [];
        if (activeTab === 'robot_view' || activeTab === 'map') {
          requests.push(
            fetch(`/api/lidar_occupancy_map?_=${cacheBust}`, { cache: 'no-store' })
              .then(response => response.json())
              .then(payload => { lidarOccupancyMap = payload; })
          );
        }
        if (activeTab === 'robot_view') {
          requests.push(
            fetch(`/api/slam/robot_pose?_=${cacheBust}`, { cache: 'no-store' })
              .then(response => response.ok ? response.json() : null)
              .then(payload => { if (payload) slamRobotPose = payload; })
          );
        }
        if (activeTab === 'map') {
          requests.push(
            fetch(`/api/toolbox_map?_=${cacheBust}`, { cache: 'no-store' })
              .then(response => response.json())
              .then(payload => { toolboxMapSnapshot = payload; })
          );
          requests.push(
            fetch(`/api/nav2_global_costmap?_=${cacheBust}`, { cache: 'no-store' })
              .then(response => response.json())
              .then(payload => { nav2GlobalCostmap = payload; })
          );
          requests.push(
            fetch(`/api/toolbox_map/persistence?_=${cacheBust}`, { cache: 'no-store' })
              .then(response => response.json())
              .then(payload => { toolboxMapPersistence = payload; })
          );
          requests.push(
            fetch(`/api/rooms?_=${cacheBust}`, { cache: 'no-store' })
              .then(response => response.json())
              .then(payload => { rooms = payload; })
          );
        }
        if (activeTab === 'map') {
          requests.push(
            fetch(appendBuildingFilter(`/api/lidar_detection_markers?_=${cacheBust}`), { cache: 'no-store' })
              .then(response => response.json())
              .then(payload => { lidarDetectionMarkers = payload; })
          );
        }
        if (activeTab === 'map') {
          requests.push(
            fetch(`/api/lidar_scan?_=${cacheBust}`, { cache: 'no-store' })
              .then(response => response.json())
              .then(payload => { lidarScanSnapshot = payload; })
          );
        }
        if (activeTab === 'map' || executionMatchesPlannedNavigation()) {
          requests.push(
            fetch(`/api/navigation/status?_=${cacheBust}`, { cache: 'no-store' })
              .then(response => response.json())
              .then(payload => { navigationExecutionStatus = payload; })
          );
        }
        await Promise.all(requests);
        syncSelectedToolboxSavedMap();
        if (rerender) {
          if (currentTab === 'map') {
            renderMapPanel();
          }
          if (currentTab === 'robot_view') {
            renderRobotViewPanel();
          }
        }
      } catch (error) {
        console.error('Failed to refresh lidar occupancy map', error);
      } finally {
        mapRefreshInFlight = false;
      }
    }

    function ensureMapRefreshLoop() {
      if (mapRefreshTimer !== null) {
        return;
      }
      mapRefreshTimer = window.setInterval(() => {
        if (!isLiveMapTab() && !executionMatchesPlannedNavigation()) {
          return;
        }
        refreshLidarOccupancyMap({ rerender: true });
      }, 3000);
    }

    function renderRecordingStatusNotice({ activeMode, toolboxAvailable, toolboxStats, toolboxStatus }) {
      if (activeMode === 'frozen') {
        return '';
      }
      if (activeMode === 'idle') {
        return `
          <div class="map-legend" style="margin-bottom: 12px;">
            <div><strong>Live map preview is available.</strong> Click <strong>Record new map</strong> to start saving a recording, or select and load a saved building.</div>

          <div><strong>Recording in progress.</strong> ${escapeHtml(statusText)}</div>
        </div>
      `;

    function syncSelectedToolboxSavedMap() {
      const maps = Array.isArray(toolboxMapPersistence?.maps) ? toolboxMapPersistence.maps : [];
      if (!maps.length) {
        selectedToolboxSavedMapName = '';
        return;
      }
      // Preserve user selection while an explicit action is in progress.
      if (toolboxMapActionInProgress && selectedToolboxSavedMapName && maps.some(map => map.name === selectedToolboxSavedMapName)) {
        return;
      }
      const candidates = [
        selectedToolboxSavedMapName,
        toolboxMapPersistence?.active_name,
        toolboxMapPersistence?.autoload_name,
      ].filter(Boolean);
      const nextName = candidates.find(name => maps.some(map => map.name === name));
      selectedToolboxSavedMapName = nextName || '';
    }

    function activeRoomMapName() {
      return toolboxMapPersistence?.active_mode === 'frozen'
        ? String(toolboxMapPersistence?.active_name || toolboxMapSnapshot?.name || '')
        : '';
    }

    function activeMapRooms() {
      const mapName = activeRoomMapName();
      const items = Array.isArray(rooms) ? rooms : [];
      if (!mapName) {
        return items.filter(room => !room.map_name);
      }
      return items.filter(room => room.map_name === mapName);
    }

    function roomsApiUrl() {
      const mapName = activeRoomMapName();
      const params = new URLSearchParams({ _: String(Date.now()) });
      if (mapName) {
        params.set('map_name', mapName);
      }
      return `/api/rooms?${params.toString()}`;
    }

    async function onToolboxSavedMapSelectionChanged(value) {
      selectedToolboxSavedMapName = String(value || '');
      if (selectedToolboxSavedMapName) {
        await loadSavedToolboxMap({ skipConfirm: true });
      } else {
        if (currentTab === 'map') {
          renderMapPanel();
        }
      }
    }

    async function requestToolboxMapAction(action, { name = '', buildingName = '' } = {}) {
      const params = new URLSearchParams();
      if (name) {
        params.set('name', name);
      }
      if (buildingName) {
        params.set('building_name', buildingName);
      }
      const response = await fetch(`/api/toolbox_map/${action}?${params.toString()}`, { method: 'POST' });
      const payload = await response.json();
      if (!response.ok) {
        throw new Error(payload.detail || `${action} failed.`);
      }
      const persistenceResponse = await fetch(`/api/toolbox_map/persistence?_=${Date.now()}`, { cache: 'no-store' });
      if (persistenceResponse.ok) {
        toolboxMapPersistence = await persistenceResponse.json();
      }
      const roomsResponse = await fetch(roomsApiUrl(), { cache: 'no-store' });
      if (roomsResponse.ok) {
        rooms = await roomsResponse.json();
      }
      syncSelectedToolboxSavedMap();
      // Ensure the map panel re-renders with fresh data even if refreshLidarOccupancyMap
      // is skipped because mapRefreshInFlight is true (concurrent poll).
      const mapResponse = await fetch(`/api/toolbox_map?_=${Date.now()}`, { cache: 'no-store' });
      if (mapResponse.ok) {
        toolboxMapSnapshot = await mapResponse.json();
      }
      if (currentTab === 'map') {
        renderMapPanel();
      }
      await refreshLidarOccupancyMap({ rerender: false });
      return payload;
    }

    async function saveCurrentToolboxMap() {
      const selectedSavedMap = Array.isArray(toolboxMapPersistence?.maps)
        ? toolboxMapPersistence.maps.find(map => map.name === selectedToolboxSavedMapName)
        : null;
      const suggestedBuildingName =
        selectedSavedMap?.building_name ||
        toolboxMapPersistence?.autoload_building_name ||
        toolboxMapPersistence?.default_name ||
        'default_map';
      const requestedBuildingName = window.prompt('Save the current map as building:', suggestedBuildingName);
      if (requestedBuildingName === null) {
        return;
      }
      toolboxMapActionInProgress = true;
      try {
        await requestToolboxMapAction('save', { buildingName: requestedBuildingName });
      } catch (error) {
        window.alert(error.message || 'Saving the toolbox map failed.');
      } finally {
        toolboxMapActionInProgress = false;
      }
    }

    async function loadSavedToolboxMap(options = {}) {
      if (!selectedToolboxSavedMapName) {
        window.alert('No saved slam_toolbox map is available yet.');
        return;
      }
      const selectedSavedMap = Array.isArray(toolboxMapPersistence?.maps)
        ? toolboxMapPersistence.maps.find(map => map.name === selectedToolboxSavedMapName)
        : null;
      if (!options?.skipConfirm) {
        const confirmed = window.confirm(
          `Load "${selectedSavedMap?.building_name || selectedToolboxSavedMapName}" as a frozen map? The map will stop updating until you record a new one.`
        );
        if (!confirmed) {
          return;
        }
      }
      toolboxMapActionInProgress = true;
      try {
        const payload = await requestToolboxMapAction('load', { name: selectedToolboxSavedMapName });
        if (payload?.message) {
          window.alert(payload.message);
        }
      } catch (error) {
        window.alert(error.message || 'Loading the saved toolbox map failed.');
      } finally {
        toolboxMapActionInProgress = false;
      }
    }

    async function deleteSavedToolboxMap() {
      if (!selectedToolboxSavedMapName) {
        window.alert('No saved map is selected.');
        return;
      }
      const selectedSavedMap = Array.isArray(toolboxMapPersistence?.maps)
        ? toolboxMapPersistence.maps.find(map => map.name === selectedToolboxSavedMapName)
        : null;
      const confirmed = window.confirm(
        `Delete the saved map for building "${selectedSavedMap?.building_name || selectedToolboxSavedMapName}"? This cannot be undone.`
      );
      if (!confirmed) {
        return;
      }
      toolboxMapActionInProgress = true;
      try {
        const payload = await requestToolboxMapAction('delete', { name: selectedToolboxSavedMapName });
        if (payload?.message) {
          window.alert(payload.message);
        }
      } catch (error) {
        window.alert(error.message || 'Deleting the saved toolbox map failed.');
      } finally {
        toolboxMapActionInProgress = false;
      }
    }

    async function deleteSelectedBuildingAndSwitch() {
      const building = selectedToolboxSavedMapName || window.getSelectedBuilding?.();
      if (!building) {
        window.alert('No building is selected. Please select a building from the Map tab first.');
        return;
      }

      const savedMaps = Array.isArray(toolboxMapPersistence?.maps) ? toolboxMapPersistence.maps : [];
      const isToolboxSelection = !!selectedToolboxSavedMapName;
      let nextName = null;

      if (isToolboxSelection) {
        const currentIndex = savedMaps.findIndex(map => map.name === building);
        const nextMap = savedMaps[currentIndex + 1] || savedMaps[currentIndex - 1] || null;
        nextName = nextMap ? nextMap.name : null;
      } else {
        try {
          const res = await fetch('/api/buildings');
          if (res.ok) {
            const buildings = await res.json();
            const names = buildings.map(b => b.name);
            const currentIndex = names.indexOf(building);
            nextName = names[currentIndex + 1] || names[currentIndex - 1] || null;
          }
        } catch (e) {
          console.warn('Failed to fetch buildings list:', e);
        }
      }

      const selectedSavedMap = savedMaps.find(map => map.name === building);
      const displayName = selectedSavedMap?.building_name || building;

      const confirmed = window.confirm(
        `Delete the building "${displayName}"? This removes all map files, scenes, objects, interactions, rooms, and navigation decisions. This cannot be undone.`
      );
      if (!confirmed) {
        return;
      }

      toolboxMapActionInProgress = true;
      try {
        const clearResponse = await fetch(`/api/map/clear_data?name=${encodeURIComponent(building)}`, { method: 'POST' });
        const clearPayload = await clearResponse.json();
        if (!clearResponse.ok) {
          throw new Error(clearPayload.detail || 'Clear map data failed.');
        }

        if (isToolboxSelection) {
          try {
            await requestToolboxMapAction('delete', { name: building });
          } catch (deleteError) {
            if (!String(deleteError.message || '').toLowerCase().includes('not found')) {
              throw deleteError;
            }
          }
        }

        window.alert(clearPayload.message || 'Building deleted.');

        if (nextName) {
          selectedToolboxSavedMapName = nextName;
          try {
            await requestToolboxMapAction('load', { name: nextName });
          } catch (loadError) {
            console.warn('Failed to auto-load next building:', loadError);
          }
          try {
            localStorage.setItem('bordsupr_selected_building', nextName);
          } catch (e) {}
        } else {
          selectedToolboxSavedMapName = '';
          try {
            localStorage.removeItem('bordsupr_selected_building');
          } catch (e) {}
        }

        window.location.reload();
      } catch (error) {
        window.alert(error.message || 'Deleting the building failed.');
      } finally {
        toolboxMapActionInProgress = false;
      }
    }

      return {
        name: String(name || '').trim(),
        x1: Number(points[0].x),
        y1: Number(points[0].y),
        x2: Number(points[1].x),
        y2: Number(points[1].y),
        x3: Number(points[2].x),
        y3: Number(points[2].y),
        x4: Number(points[3].x),
        y4: Number(points[3].y),
      };
    }

    function startRoomMarking() {
      const activeMode = toolboxMapPersistence?.active_mode || 'idle';
      if (activeMode !== 'frozen') {
        window.alert('Save and freeze a map first, then mark rooms on that saved map.');
        return;
      }
      roomMarkingMode = !roomMarkingMode;
      roomDraftPoints = [];
      roomDraftName = '';
      roomDraftError = null;
      if (!roomMarkingMode) {
        roomDrafts = [];

        roomDrafts = Array.isArray(rooms) ? rooms.map(room => ({
          name: room.name,
          x1: Number(room.x1),
          y1: Number(room.y1),
          x2: Number(room.x2),
          y2: Number(room.y2),
          x3: room.x3 != null ? Number(room.x3) : null,
          y3: room.y3 != null ? Number(room.y3) : null,
          x4: room.x4 != null ? Number(room.x4) : null,
          y4: room.y4 != null ? Number(room.y4) : null,
        })) : [];
        customPathMode = false;
        customPathPoints = [];
        customPathError = null;

        renderMapPanel();

    }

    function clearRoomDraftPoints() {
      roomDraftPoints = [];
      roomDraftError = null;
      if (currentTab === 'map') {
        renderMapPanel();
      }
    }

    function updateRoomDraftName(value) {
      roomDraftName = String(value || '');
    }

    function addDraftRoom() {
      if (roomDraftPoints.length < 4) {
        roomDraftError = 'Select 4 corners first.';
        if (currentTab === 'map') renderMapPanel();
        return;
      }
      const fallbackName = `Room ${roomDrafts.length + 1}`;
      const name = roomDraftName.trim() || fallbackName;
      if (!name) {
        roomDraftError = 'Enter a room name.';
        if (currentTab === 'map') renderMapPanel();
        return;
      }
      roomDrafts = [...roomDrafts, buildRoomDraftFromPoints(name, roomDraftPoints)];
      roomDraftPoints = [];
      roomDraftName = '';
      roomDraftError = null;
      if (currentTab === 'map') {
        renderMapPanel();
      }
    }

    async function saveMarkedRooms() {
      const activeMode = toolboxMapPersistence?.active_mode || 'idle';
      const activeMapName = toolboxMapPersistence?.active_name || '';
      if (activeMode !== 'frozen' || !activeMapName) {
        window.alert('Load or save a frozen map first, then save its rooms.');
        return;
      }
      try {
        const response = await fetch('/api/rooms/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ map_name: activeMapName, rooms: roomDrafts }),
        });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || 'Saving rooms failed.');
        }
        rooms = Array.isArray(payload.rooms)
          ? payload.rooms.map(room => ({ ...room, map_name: activeMapName }))
          : [];
        roomMarkingMode = false;
        roomDraftPoints = [];
        roomDraftName = '';
        roomDraftError = null;
        roomDrafts = [];
        if (currentTab === 'map') {
          renderMapPanel();
        }
      } catch (error) {
        roomDraftError = error.message || 'Saving rooms failed.';
        if (currentTab === 'map') {
          renderMapPanel();
        }
      }
    }

    async function createNewMap() {
      const confirmed = window.confirm(
        'Step 1: start recording a new map from scratch? This clears the current working map, persisted detections, frozen-map selection, and planned navigation state.'
      );
      if (!confirmed) {
        return;
      }
      newMapStartedAt = Date.now();
      await resetMapAndDetections({ skipConfirm: true, mode: 'recording' });
    }

    async function cancelRecording() {
      const confirmed = window.confirm(
        'Cancel the current recording without saving? This discards all unsaved map data and cannot be undone.'
      );
      if (!confirmed) {
        return;
      }
      newMapStartedAt = 0;
      await resetMapAndDetections({ skipConfirm: true });
    }

    function togglePersistedDetectionImages(checked) {
      showPersistedDetectionImages = Boolean(checked);
      if (currentTab === 'map') {
        renderMapPanel();
      }
    }

    async function resetMapAndDetections(options = {}) {
      const skipConfirm = Boolean(options?.skipConfirm);
      const mode = options?.mode || '';
      if (!skipConfirm) {
        const confirmed = window.confirm(
          'Reset the stored map and all persisted detections? This clears the current map files, saved detections, and planned navigation state.'
        );
        if (!confirmed) {
          return;
        }
      }

      try {
        const resetUrl = mode ? `/api/map/reset?mode=${encodeURIComponent(mode)}` : '/api/map/reset';
        const response = await fetch(resetUrl, { method: 'POST' });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || 'Reset failed.');
        }

        plannedNavigation = null;
        navigationExecutionStatus = { available: false, state: 'idle' };
        lidarOccupancyMap = { available: false, reason: 'map_reset' };
        toolboxMapSnapshot = { available: false, reason: 'map_reset' };
        nav2GlobalCostmap = { available: false, reason: 'map_reset' };
        toolboxMapPersistence = { available: false, maps: [], status: { state: 'idle' } };
        lidarDetectionMarkers = [];
        lidarScanSnapshot = { available: false, reason: 'map_reset' };
        observationTopoObservations = [];
        rooms = [];
        roomMarkingMode = false;
        roomDraftPoints = [];
        roomDraftName = '';
        roomDrafts = [];
        roomDraftError = null;
        scenePagination = { offset: 0, total: null, hasMore: true, loading: false, initialized: false, error: null };
        objectPagination = { offset: 0, total: null, hasMore: true, loading: false, initialized: false, error: null };
        scenes = [];
        objects = [];
        interactions = [];
        selectedToolboxSavedMapName = '';

        if (!skipConfirm) {
          newMapStartedAt = 0;
        }
        tabLoaded.clear();
        await loadTabData(currentTab);
      } catch (error) {
        newMapStartedAt = 0;
        window.alert(error.message || 'Reset failed.');
      }
    }

    async function clearDetectionsOnly() {
      const confirmed = window.confirm('Clear all persisted detections? This removes stored observation coordinates from the database but keeps the map and rooms intact.');
      if (!confirmed) {
        return;
      }
      try {
        const response = await fetch('/api/detections/clear', { method: 'POST' });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || 'Clear detections failed.');
        }
        lidarDetectionMarkers = [];
        observationTopoObservations = [];
        if (currentTab === 'map') {
          renderMapPanel();
        }
      } catch (error) {
        window.alert(error.message || 'Clear detections failed.');
      }
    }

    async function clearScenesForBuilding() {
      const building = selectedToolboxSavedMapName || window.getSelectedBuilding?.();
      if (!building) {
        window.alert('No building is selected. Please select a building from the Map tab first.');
        return;
      }
      const confirmed = window.confirm(`Clear all scenes for "${building}"? This removes all scene records, their images, and linked object observations. Rooms, navigation decisions, and the map itself are kept.`);
      if (!confirmed) {
        return;
      }
      try {
        const response = await fetch(`/api/scenes/clear?building=${encodeURIComponent(building)}`, { method: 'POST' });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || 'Clear scenes failed.');
        }

      } catch (error) {

    async function deleteScene(sceneId) {
      if (!window.confirm(`Delete scene ${sceneId}? This cannot be undone.`)) {
        return;
      }
      try {
        const response = await fetch(`/api/scenes/${encodeURIComponent(sceneId)}`, { method: 'DELETE' });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || 'Delete scene failed.');
        }
        // Remove the deleted scene from the local array and re-render
        const idx = scenes.findIndex(s => s.id === sceneId);
        if (idx !== -1) {
          scenes.splice(idx, 1);
        }
        renderScenesTable();
        // If the details panel is showing this scene, clear it
        const detailsEl = document.getElementById('details-content');
        if (detailsEl && detailsEl.innerHTML.includes(`scene-${sceneId}`)) {
          detailsEl.innerHTML = '<div class="text-muted">Select a scene to view details.</div>';
        }
      } catch (error) {
        window.alert(error.message || 'Delete scene failed.');
      }
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function jsStringLiteral(value) {
      return JSON.stringify(String(value ?? ''));
    }

    function formatNamedObject(name, objectId) {
      const trimmed = typeof name === 'string' ? name.trim() : '';
      if (trimmed) {
        return `<strong>${escapeHtml(trimmed)}</strong> <span class="muted">(${escapeHtml(objectId)})</span>`;
      }
      return `<strong>${escapeHtml(objectId)}</strong>`;
    }

    function sceneOriginalImageUrl(sceneId) {
      if (sceneId === null || sceneId === undefined || sceneId === '') {
        return null;
      }
      return `/api/scenes/${encodeURIComponent(sceneId)}/original_image`;
    }

    function sceneStitchedImageUrl(sceneId) {
      if (sceneId === null || sceneId === undefined || sceneId === '') {
        return null;
      }
      return `/api/scenes/${encodeURIComponent(sceneId)}/stitched_image`;
    }

    function personHasStoredFace(person) {
      return Number(person?.face_observation_count ?? 0) >= 1;
    }

    function getVisiblePersons() {
      return filterPersonsWithFace ? persons.filter(personHasStoredFace) : persons;
    }

    function resetRecognizedPersonDetails(message = 'Select a recognized person.') {
      document.getElementById('details-panel').style.display = '';
      document.getElementById('detailTitle').textContent = 'Details';
      document.getElementById('details').textContent = message;
    }

    function togglePersonsWithFaceFilter() {
      filterPersonsWithFace = Boolean(document.getElementById('filter-persons-with-face')?.checked);
      const visiblePersons = getVisiblePersons();
      renderPersonsList();
      if (selectedPersonId && !visiblePersons.some((person) => String(person.id) === String(selectedPersonId))) {
        selectedPersonId = null;
        if (currentTab === 'persons') {
          resetRecognizedPersonDetails(visiblePersons.length
            ? 'Select a recognized person.'
            : 'No recognized person with at least one stored face matches the current filter.');
        }
      }
    }

    async function updateObjectName(objectId, rawName) {
      const response = await fetch(`/api/objects/${encodeURIComponent(objectId)}/name`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: (rawName || '').trim() || null }),
      });
      if (!response.ok) {
        throw new Error(`Failed to save name (${response.status})`);
      }
      const result = await response.json();
      const savedName = result.name ?? null;
      objects = objects.map((item) => String(item.id) === String(objectId) ? { ...item, name: savedName } : item);
      persons = persons.map((item) => String(item.id) === String(objectId) ? { ...item, name: savedName } : item);
      renderObjectsList();
      renderPersonsList();
      return savedName;
    }

    async function saveObjectName(objectId, inputId) {
      const input = document.getElementById(inputId);
      if (!input) {
        return;
      }
      try {
        const savedName = await updateObjectName(objectId, input.value);
        input.value = savedName || '';
      } catch (error) {
        alert(error instanceof Error ? error.message : 'Failed to save object name.');
      }
    }

    async function deleteObservation(observationId, objectId) {
      if (!window.confirm(`Delete observation ${observationId}? This cannot be undone.`)) {
        return;
      }
      try {
        const res = await fetch(`/api/observations/${encodeURIComponent(observationId)}`, { method: 'DELETE' });
        if (!res.ok) {
          const text = await res.text().catch(() => '');
          throw new Error(text || `HTTP ${res.status}`);
        }
        const data = await res.json();
        if (data.deleted_orphaned_objects > 0) {
          alert(`Observation ${observationId} deleted. The cluster was removed because it had no remaining observations.`);
          await loadObjects();
          document.getElementById('details').innerHTML = '<div class="text-muted">The cluster was removed because it had no remaining observations.</div>';
        } else {
          await showObject(objectId);
        }
      } catch (err) {
        alert(`Failed to delete observation: ${err.message}`);
      }
    }

    async function saveClusterObjectName(objectId, inputId) {
      await saveObjectName(objectId, inputId);
    }

    function setImageModalState({ title = '', status = '', showNavigateButton = false, navigateBusy = false } = {}) {
      const titleEl = document.getElementById('image-modal-title');
      const statusEl = document.getElementById('image-modal-status');
      const navigateBtn = document.getElementById('image-modal-navigate-btn');
      if (titleEl) {
        titleEl.textContent = title || '';
      }
      if (statusEl) {
        statusEl.textContent = status || '';
      }
      if (navigateBtn) {
        navigateBtn.style.display = showNavigateButton ? '' : 'none';
        navigateBtn.disabled = Boolean(navigateBusy);
        navigateBtn.textContent = navigateBusy ? 'Planning…' : 'Navigate here';
      }
    }

    function openImageModal(url, title = '') {
      const modal = document.getElementById('image-modal');
      const img = document.getElementById('image-modal-img');
      if (!modal || !img || !url) {
        return;
      }
      imageModalContext = null;
      img.src = url;
      setImageModalState({ title, status: '', showNavigateButton: false, navigateBusy: false });
      modal.classList.add('open');
    }

    function openPersistedDetectionModal(url, title = '', observationId = null) {
      const modal = document.getElementById('image-modal');
      const img = document.getElementById('image-modal-img');
      if (!modal || !img || !url) {
        return;
      }
      imageModalContext = {
        type: 'persisted_detection',
        observationId,
        title,
        imageUrl: url,
      };
      img.src = url;
      setImageModalState({
        title,
        status: plannedNavigation && plannedNavigation.observation?.id === observationId
          ? 'Planned preview path is shown on the occupancy map.'
          : 'Plan a path preview from the current robot pose to this saved detection pose.',
        showNavigateButton: Boolean(observationId),
        navigateBusy: false,
      });
      modal.classList.add('open');
    }

    async function planNavigationToModalDetection() {
      if (!imageModalContext || imageModalContext.type !== 'persisted_detection' || !imageModalContext.observationId) {
        return;
      }

      setImageModalState({
        title: imageModalContext.title,
        status: 'Planning a path on the occupancy map…',
        showNavigateButton: true,
        navigateBusy: true,
      });

      try {
        const response = await fetch(`/api/lidar_detection_markers/${imageModalContext.observationId}/plan`, {
          method: 'POST',
        });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || 'Planning failed');
        }

        plannedNavigation = payload;
        closeImageModal();
        showTab('map');
        renderMapPanel();
      } catch (error) {
        setImageModalState({
          title: imageModalContext.title,
          status: error.message || 'Planning failed.',
          showNavigateButton: true,
          navigateBusy: false,
        });
      }
    }

    function closeImageModal() {
      const modal = document.getElementById('image-modal');
      const img = document.getElementById('image-modal-img');
      if (!modal || !img) {
        return;
      }
      modal.classList.remove('open');
      img.removeAttribute('src');
      imageModalContext = null;
      setImageModalState({ title: '', status: '', showNavigateButton: false, navigateBusy: false });
    }

    function clearPlannedNavigation() {
      plannedNavigation = null;
      if (currentTab === 'map') {
        renderMapPanel();
      }
    }

    function executionMatchesPlannedNavigation() {
      if (!plannedNavigation || !navigationExecutionStatus || !navigationExecutionStatus.available) {
        return false;
      }
      const plannedObservationId = plannedNavigation.observation?.id ?? null;
      const executedObservationId = navigationExecutionStatus.observation?.id ?? null;
      return plannedObservationId !== null && plannedObservationId === executedObservationId;
    }

    function navigationExecutionSummary() {
      if (!navigationExecutionStatus || !navigationExecutionStatus.available) {
        return 'No active navigation execution request.';
      }
      const state = String(navigationExecutionStatus.state || 'unknown');
      const message = navigationExecutionStatus.message ? ` ${navigationExecutionStatus.message}` : '';
      return `Execution state: ${state}.${message}`;
    }

    async function acceptPlannedNavigation() {
      if (!plannedNavigation) {
        return;
      }
      if (!plannedNavigation.navigation_execution?.available) {
        renderMapPanel();
        return;
      }

      const status = navigationExecutionStatus || {};
      if (status.available && ['queued', 'running'].includes(String(status.state || ''))) {
        renderMapPanel();
        return;
      }

      navigationExecutionStatus = {
        available: true,
        state: 'submitting',
        message: 'Submitting accepted trajectory to the robot executor.',
        observation: plannedNavigation.observation,
      };
      renderMapPanel();

      try {
        const response = await fetch('/api/navigation/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(plannedNavigation),
        });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || 'Failed to submit navigation request.');
        }
        navigationExecutionStatus = payload;
      } catch (error) {
        navigationExecutionStatus = {
          available: true,
          state: 'failed',
          message: error.message || 'Failed to submit navigation request.',
          observation: plannedNavigation.observation,
        };
      }

      renderMapPanel();
    }

    function rememberOccupancyMapScroll(viewportKey) {
      const viewport = document.getElementById(`zoom-viewport-${viewportKey}`);
      if (!viewport) {
        return;
      }
      occupancyMapScrollState[viewportKey] = {
        left: viewport.scrollLeft,
        top: viewport.scrollTop,
      };
    }

    function restoreOccupancyMapScroll(viewportKey) {
      const saved = occupancyMapScrollState[viewportKey];
      if (!saved) {
        return;
      }
      window.requestAnimationFrame(() => {
        const viewport = document.getElementById(`zoom-viewport-${viewportKey}`);
        if (!viewport) {
          return;
        }
        viewport.scrollLeft = saved.left;
        viewport.scrollTop = saved.top;
      });
    }

    function showTab(tab) {
      currentTab = tab;
      loadTabData(tab);
      const url = new URL(window.location.href);
      url.searchParams.set('tab', tab);
      window.history.replaceState({}, '', url);
      document.getElementById('tab-scenes').classList.toggle('active', tab === 'scenes');
      document.getElementById('tab-objects').classList.toggle('active', tab === 'objects');
      document.getElementById('tab-persons').classList.toggle('active', tab === 'persons');
      document.getElementById('tab-interactions').classList.toggle('active', tab === 'interactions');
      document.getElementById('tab-map').classList.toggle('active', tab === 'map');
      document.getElementById('tab-robot-view').classList.toggle('active', tab === 'robot_view');
      document.getElementById('scenes-panel').style.display = tab === 'scenes' ? '' : 'none';
      document.getElementById('objects-panel').style.display = tab === 'objects' ? '' : 'none';
      document.getElementById('persons-panel').style.display = tab === 'persons' ? '' : 'none';
      document.getElementById('interactions-panel').style.display = tab === 'interactions' ? '' : 'none';
      document.getElementById('map-panel').style.display = tab === 'map' ? '' : 'none';
      document.getElementById('robot-view-panel').style.display = tab === 'robot_view' ? '' : 'none';
      document.getElementById('details-panel').style.display = tab === 'scenes' || tab === 'objects' || tab === 'persons' || tab === 'interactions' ? '' : 'none';
      document.getElementById('details').innerHTML = tab === 'scenes'
        ? 'Select a scene.'
        : (tab === 'objects' ? 'Select an object cluster.' : (tab === 'persons' ? 'Select a recognized person.' : 'Select an interaction.'));
      document.getElementById('detailTitle').textContent = 'Details';
      if (tab === 'map') {
        renderMapPanel();
        refreshLidarOccupancyMap({ rerender: true });
      } else if (tab === 'robot_view') {
        renderRobotViewPanel();
        refreshLidarOccupancyMap({ rerender: true });
      } else if (tab === 'scenes' || tab === 'objects') {
        window.requestAnimationFrame(() => handleLazyPanelScroll(tab));
      }
      updateEarlierSceneButton();
    }

    function renderScenesTable() {
      const el = document.getElementById('scenes-table');
      if (!scenePagination.initialized && scenePagination.loading) {
        el.innerHTML = '<div class="text-muted">Loading scenes…</div>';
        return;
      }
      if (scenePagination.error && !scenes.length) {
        el.innerHTML = `<div class="text-danger">${scenePagination.error}</div>`;
        return;
      }
      if (!scenes.length) {
        el.innerHTML = '<div class="text-muted">No scenes found.</div>';
        return;
      }
      const filterEl = document.getElementById('filter-with-description');
      const filterActive = filterEl && filterEl.checked;
      // Sort scenes by timestamp descending
      const sortedScenes = [...scenes]
        .filter(s => !filterActive || (s.caption && s.caption.trim()))
        .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      if (!sortedScenes.length) {
        el.innerHTML = '<div class="text-muted">No scenes with a description found.</div>';
        return;
      }
      el.innerHTML = `
        <table class="table table-striped table-hover align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Caption</th>
              <th>Objects</th>
              <th>Timestamp</th>
              <th>X</th>
              <th>Y</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${sortedScenes.map(s => `
              <tr style="cursor:pointer" onclick="focusScene(${s.id})">
                <td>${s.id}</td>
                <td>${s.caption || '(no caption)'}</td>
                <td>${(s.objects && s.objects.length)
                  ? s.objects.map(o => `${escapeHtml(o.name || o.class_name || ('object ' + o.object_id))}${o.count > 1 ? ' \u00d7' + o.count : ''}`).join(', ')
                  : '<span class="text-muted">\u2014</span>'}</td>
                <td>${new Date(s.timestamp).toLocaleString()}</td>
                <td>${s.x ?? '-'}</td>
                <td>${s.y ?? '-'}</td>
                <td>
                  <button class="btn btn-sm btn-outline-primary" onclick="event.stopPropagation(); focusScene(${s.id})">Details</button>
                  <button class="btn btn-sm btn-outline-danger ms-1" onclick="event.stopPropagation(); deleteScene(${s.id})">Delete</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        <div class="text-muted small">
          ${renderPagedCountLabel(scenes, scenePagination, 'scenes')}
          ${scenePagination.loading ? ' Loading more…' : ''}
          ${scenePagination.hasMore && !scenePagination.loading ? ' Scroll to load more.' : ''}
          ${scenePagination.error ? ` ${scenePagination.error}` : ''}
        </div>
      `;
    }

        <div class="text-muted small">

    let _interactionReloadPollTimer = null;
    async function reloadInteractions() {
      const resultDiv = document.getElementById('reload-interactions-result');
      const btn = document.getElementById('reload-interactions-btn');
      const building = (window.getSelectedBuilding && window.getSelectedBuilding()) || '';
      if (!building) {
        resultDiv.innerHTML = '<span style="color:#b00020;">Select a building/map first (top bar) before reloading interactions.</span>';
        return;
      }
      if (!window.confirm(`Regenerate ALL interactions for map "${building}" from stored scene images? This deletes the map's current interactions and recreates them (object/scene clusters are not changed). Continue?`)) {
        return;
      }
      if (_interactionReloadPollTimer) {
        clearInterval(_interactionReloadPollTimer);
        _interactionReloadPollTimer = null;
      }
      if (btn) btn.disabled = true;
      resultDiv.textContent = 'Starting interaction reload...';
      try {
        const res = await fetch(`/api/interactions/reload?building=${encodeURIComponent(building)}`, { method: 'POST' });
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(errText || `Reload failed with ${res.status}`);
        }
        const startData = await res.json();
        const jobId = startData.job_id;
        resultDiv.innerHTML = `<span class="meta">Reloading interactions… job <code>${escapeHtml(jobId)}</code> started.</span>`;
        _interactionReloadPollTimer = setInterval(async () => {
          try {
            const pollRes = await fetch(`/api/interactions/reload/jobs/${jobId}`);
            if (!pollRes.ok) return;
            const job = await pollRes.json();
            if (job.status === 'running' || job.status === 'queued') {
              const done = job.steps_done || 0;
              const total = job.total_steps || 0;
              const phase = job.phase ? ` (${escapeHtml(job.phase)})` : '';
              resultDiv.innerHTML = `<span class="meta">Reloading interactions… scene ${done} / ${total}${phase}</span>`;
            } else if (job.status === 'done') {
              clearInterval(_interactionReloadPollTimer);
              _interactionReloadPollTimer = null;
              if (btn) btn.disabled = false;
              const r = job.result || {};
              resultDiv.innerHTML = `
                <div style="border-left:3px solid #0d6efd;background:#f0f5ff;padding:6px 10px;border-radius:8px;">
                  <div style="font-weight:700;color:#0d6efd;font-size:13px;">Interaction reload complete</div>
                  <div class="meta">${r.interactions_inserted || 0} interactions regenerated from ${r.scenes_processed || 0} scenes (${r.scenes_skipped || 0} skipped).</div>
                </div>
              `;
              interactions = [];
              const res2 = await fetch(appendBuildingFilter(`/api/interactions?both_linked=${interactionsBothLinked}`));
              interactions = await res2.json();
              renderInteractionsList();
            } else if (job.status === 'error') {
              clearInterval(_interactionReloadPollTimer);
              _interactionReloadPollTimer = null;
              if (btn) btn.disabled = false;
              resultDiv.innerHTML = `<span style="color:#b00020;">${escapeHtml(job.error || 'Unknown error')}</span>`;
            }
          } catch (e) {
            // ignore poll errors
          }
        }, 2000);
      } catch (err) {
        if (btn) btn.disabled = false;
        resultDiv.innerHTML = `<span style="color:#b00020;">${escapeHtml(err.message || String(err))}</span>`;
      }
    }

    let detailLazyObservers = [];

    function disconnectDetailLazyObservers() {

    function setupLazyGrid({ items, gridId, sentinelId, renderCard, batchSize = 60 }) {
      const grid = document.getElementById(gridId);
      const sentinel = document.getElementById(sentinelId);
      if (!grid || !sentinel) {
        return;
      }
      let nextIndex = 0;
      const appendBatch = () => {
        const batch = items.slice(nextIndex, nextIndex + batchSize);
        if (batch.length) {
          grid.insertAdjacentHTML('beforeend', batch.map(renderCard).join(''));
          nextIndex += batch.length;
        }
        const remaining = items.length - nextIndex;
        if (remaining <= 0) {
          sentinel.style.display = 'none';
        } else {
          sentinel.style.display = '';
          const btn = sentinel.querySelector('button');
          if (btn) {
            btn.textContent = `Load more (${remaining} remaining)`;
          }
        }
      };
      const btn = sentinel.querySelector('button');
      if (btn) {
        btn.addEventListener('click', appendBatch);
      }
      const observer = new IntersectionObserver((entries) => {
        if (entries.some((entry) => entry.isIntersecting)) {
          appendBatch();
        }
      }, { rootMargin: '800px' });
      observer.observe(sentinel);
      detailLazyObservers.push(observer);
      appendBatch();
    }

<script>
(function() {
  const STORAGE_KEY = 'bordsupr_selected_building';

  window.getSelectedBuilding = function() {
    try {
      return localStorage.getItem(STORAGE_KEY) || '';
    } catch (e) {
      return '';
    }
  };

  window.onBuildingChanged = function(value) {
    try {
      if (value) {
        localStorage.setItem(STORAGE_KEY, value);
      } else {
        localStorage.removeItem(STORAGE_KEY);
      }
    } catch (e) {}
    window.location.reload();
  };

  window.appendBuildingFilter = function(url) {
    const building = window.getSelectedBuilding();
    if (!building) return url;
    const sep = url.includes('?') ? '&' : '?';
    return url + sep + 'building=' + encodeURIComponent(building);
  };

  async function loadBuildings() {
    try {
      const res = await fetch('/api/buildings');
      if (!res.ok) return;
      const buildings = await res.json();
      const selector = document.getElementById('building-selector');
      if (!selector) return;
      const current = window.getSelectedBuilding();
      selector.innerHTML = '<option value="">All Buildings</option>';
      for (const b of buildings) {
        const opt = document.createElement('option');
        opt.value = b.name;
        opt.textContent = b.name;
        if (b.name === current) opt.selected = true;
        selector.appendChild(opt);
      }
    } catch (e) {
      console.warn('Failed to load buildings:', e);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadBuildings);
  } else {
    loadBuildings();
  }

  // Re-fetch building list whenever the dropdown is opened so newly
  // created maps appear without requiring a full page refresh.
  function _attachBuildingRefresh() {
    const selector = document.getElementById('building-selector');
    if (selector) {
      selector.addEventListener('mousedown', loadBuildings);
      selector.addEventListener('focus', loadBuildings);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _attachBuildingRefresh);
  } else {
    _attachBuildingRefresh();
  }

  // Also refresh every 10 seconds in the background so newly created
  // buildings appear automatically without any user interaction.
  setInterval(loadBuildings, 10000);
})();
</script>

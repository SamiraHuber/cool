fixtures = ["desk_1", "desk_2"]
[world.rooms."office 7"]
type = "office"
capacity = 2
fixtures = ["desk_1", "desk_2"]
[world.rooms."meeting room 1"]
type = "meeting"
capacity = 10
fixtures = ["projector", "whiteboard", "conference_table"]
[world.rooms."meeting room 2"]
type = "meeting"

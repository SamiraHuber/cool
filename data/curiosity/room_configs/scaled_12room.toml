# scaled_12room: one bigger single-floor office, no wings (design §9.2).
# 7 offices, 2 meeting rooms, kitchen, storage, printer room; 14 people.
extends = "intent_cued.toml"
name = "scaled_12room"

[output]
dir = "data/curiosity/datasets/scaled_12room"

# Replace the whole world subtree (do not merge with the 6-room world).
[world]
__replace__ = true

[world.distances]
default = 2
[[world.distances.exceptions]]
pair = ["office 1", "office 2"]
d = 1
[[world.distances.exceptions]]
pair = ["office 4", "office 5"]
d = 1
[[world.distances.exceptions]]
pair = ["office 6", "office 7"]
d = 1
[[world.distances.exceptions]]
pair = ["office 1", "office 7"]
d = 4
[[world.distances.exceptions]]
pair = ["office 2", "office 6"]
d = 4
[[world.distances.exceptions]]
pair = ["kitchen", "office 7"]
d = 3
[[world.distances.exceptions]]
pair = ["kitchen", "office 1"]
d = 3
[[world.distances.exceptions]]
pair = ["storage", "printer room"]
d = 1
[[world.distances.exceptions]]
pair = ["meeting room 1", "meeting room 2"]
d = 1

[world.rooms.kitchen]
type = "social"
capacity = 8
fixtures = ["coffee_machine", "fridge", "microwave"]
[world.rooms.storage]
type = "utility"
capacity = 4
fixtures = ["shelf", "toolbox"]
[world.rooms."printer room"]
type = "utility"
capacity = 3
fixtures = ["printer", "paper_shelf"]
[world.rooms."office 1"]

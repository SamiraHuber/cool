# scaled_distractor_calm_24room: 24-room distractor world, GENERALLY LESS
# ACTIVITY. Mirrors distractor_calm.toml at 24-room scale: p_move ~halved,
# distractor churn 4.0 -> 1.5, weaker time peaks, thinned schedule
# (fewer events, smaller samples).
extends = "scaled_distractor_24room.toml"
name = "scaled_distractor_calm_24room"

[output]
dir = "data/curiosity/datasets/scaled_distractor_calm_24room"

[decisions.p_move.base]
office = 0.30
social = 0.45
meeting = 0.35
utility = 0.28

[decisions.p_move.room_multipliers]
kitchen = 1.5
"meeting room 1" = 1.5

[[decisions.time_multipliers]]
window = ["12:00", "12:30"]
factor = 1.3
[[decisions.time_multipliers]]
window = ["13:30", "14:00"]
factor = 1.2
[[decisions.time_multipliers]]
window = ["09:00", "09:30"]
factor = 0.7

# thinned schedule: 3 events/day instead of 4-5, smaller samples
[[schedule]]
day_index = 0
start = "09:05"
end = "09:15"
room = "meeting room 1"
people_sample = 12
description = "morning stand-up"

# scaled_24room: one large single-floor office (no wings), 24 rooms, 40 people.
# 16 offices (1-4 people each), 3 meeting rooms, kitchen, lounge,
# storage, printer room, server room. Episodes inherited from intent_cued,
# scaled up via [episodes] per_day below.
extends = "intent_cued.toml"
name = "scaled_24room"

[output]
dir = "data/curiosity/datasets/scaled_24room"

# More episodes per day than the 6/12-room worlds (40 people, 24 rooms).
[episodes]
per_day = [8, 12]

# Replace the whole world subtree (do not merge with the 6-room world).
[world]
__replace__ = true

# Bigger floor than the 12-room world: default distance 3, exceptions for
# adjacent / clustered rooms.
[world.distances]
default = 3
[[world.distances.exceptions]]
pair = ["office 1", "office 2"]
d = 1
[[world.distances.exceptions]]
pair = ["office 3", "office 4"]
d = 1
[[world.distances.exceptions]]
pair = ["office 5", "office 6"]
d = 1
[[world.distances.exceptions]]
pair = ["office 7", "office 8"]
d = 1
[[world.distances.exceptions]]
pair = ["office 9", "office 10"]
d = 1
[[world.distances.exceptions]]
pair = ["office 11", "office 12"]
d = 1
[[world.distances.exceptions]]
pair = ["office 13", "office 14"]
d = 1
[[world.distances.exceptions]]
pair = ["office 15", "office 16"]
d = 1
[[world.distances.exceptions]]
pair = ["kitchen", "lounge"]
d = 1
[[world.distances.exceptions]]
pair = ["kitchen", "office 1"]
d = 2
[[world.distances.exceptions]]
pair = ["lounge", "office 16"]
d = 2
[[world.distances.exceptions]]
pair = ["storage", "printer room"]
d = 1
[[world.distances.exceptions]]
pair = ["printer room", "server room"]
d = 1
[[world.distances.exceptions]]
pair = ["meeting room 1", "meeting room 2"]
d = 1
[[world.distances.exceptions]]
pair = ["meeting room 2", "meeting room 3"]
d = 1
[[world.distances.exceptions]]
pair = ["server room", "kitchen"]
d = 5
[[world.distances.exceptions]]
pair = ["server room", "meeting room 1"]
d = 5


# scaled_heading_12room: 12-room intent world with MORE intent clues:
# - more episodes per day (8-10 vs 4-6 inherited from intent_cued)
# - heading cues: departure cues often name the destination
extends = "scaled_12room.toml"
name = "scaled_heading_12room"

[output]
dir = "data/curiosity/datasets/scaled_heading_12room"

[episodes]
per_day = [8, 10]

[cues]
p_heading = 0.5          # fallback for any source not listed below

[cues.p_heading_by_source]
episode = 0.7            # scripted intent: usually announced
schedule = 0.6           # meeting-bound: often announced
random = 0.4             # spontaneous: announced less than half the time
